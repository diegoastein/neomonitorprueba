                    { name: { es: 'Post-desfibrilación', en: 'Post-defibrillation', pt: 'Pós-desfibrilação' }, hr: 42, spo2: 78, transition: 15 },
                    { name: { es: 'Recuperación', en: 'Recovery', pt: 'Recuperação' }, hr: 88, spo2: 90, transition: 20 },
                    { name: { es: 'Estabilización', en: 'Stabilization', pt: 'Estabilização' }, hr: 80, spo2: 96, transition: 15 },
                ]
            },
        ];

        function LoginPage({ onAuthenticate }) {
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleLogin = () => {
                if (password === 'neomonitor2024') {
                    localStorage.setItem('neomonitor_admin_auth', 'true');
                    onAuthenticate();
                } else {
                    setError('Contraseña incorrecta');
                    setPassword('');
                }
            };

            return (
                <div className="w-full h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 to-slate-900">
                    <div className="bg-slate-800 p-8 rounded-lg border border-slate-700 w-96">
                        <h1 className="text-3xl font-bold mb-2 text-center">NeoMonitor</h1>
                        <p className="text-center text-slate-400 mb-6">Panel de Administración</p>

                        <div className="mb-4">
                            <label className="block text-sm mb-2">Clave de Acceso</label>
                            <input
                                type="password"
                                value={password}
                                onChange={(e) => setPassword(e.target.value)}
                                onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                                placeholder="Ingresa la clave"
                                className="w-full"
                            />
                        </div>

                        {error && <p className="text-red-400 text-sm mb-4">{error}</p>}

                        <button
                            onClick={handleLogin}
                            className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded active:scale-95 transition"
                        >
                            Acceder
                        </button>
                    </div>
                </div>
            );
        }

        function AdminPanel({ onLogout }) {
            const [cases, setCases] = useState([]);
            const [selectedCase, setSelectedCase] = useState(null);
            const [editingCase, setEditingCase] = useState(null);
            const [creatingCase, setCreatingCase] = useState(false);
            const [loading, setLoading] = useState(true);
            const [syncStatus, setSyncStatus] = useState('');
            const [newCaseForm, setNewCaseForm] = useState(null);

            useEffect(() => {
                loadCases();
            }, []);

            const normalizeCases = (cases) => {
                return cases.map(c => {
                    const normalizeField = (val) => val && typeof val === 'object' ? val : { es: val || '', en: val || '', pt: val || '' };
                    return {
                        ...c,
                        title: normalizeField(c.title),
                        presentation: normalizeField(c.presentation),
                        stages: (c.stages || []).map(stage => ({
                            ...stage,
                            name: normalizeField(stage.name)
                        }))
                    };
                });
            };

            const loadCases = async () => {
                setLoading(true);
                try {
                    // Cargar casos predefinidos
                    const docSnap = await db.collection('admin').doc('clinical_cases').get();
                    const predefined = docSnap.exists ? docSnap.data().cases || DEFAULT_CLINICAL_CASES : DEFAULT_CLINICAL_CASES;

                    // Cargar casos de comunidad desde library
                    const libSnap = await db.collection('library').get();
                    const community = libSnap.docs.map(d => ({
                        ...d.data(),
                        id: d.id,
                        _source: 'library'
                    }));

                    // Combinar: predefinidos primero, luego comunidad
                    let allCases = [...predefined, ...community];
                    // Normalizar estructura de todas las etapas
                    allCases = normalizeCases(allCases);
                    setCases(allCases);
                } catch (error) {
                    console.error('Error loading cases:', error);
                    setCases(DEFAULT_CLINICAL_CASES);
                }
                setLoading(false);
            };

            const saveCases = async (updatedCases) => {
                setSyncStatus('Sincronizando...');
                try {
                    // Separar casos por origen
                    const predefined = updatedCases.filter(c => !c._source);
                    const community = updatedCases.filter(c => c._source === 'library');

                    // Guardar predefinidos en admin/clinical_cases
                    if (predefined.length > 0) {
                        await db.collection('admin').doc('clinical_cases').set({ cases: predefined });
                    }

                    // Guardar casos de comunidad en library (uno por uno)
                    for (const c of community) {
                        const { _source, ...clean } = c;
                        if (c.id) {
                            await db.collection('library').doc(c.id).set(clean);
                        }
                    }

                    setSyncStatus('✓ Sincronizado');
                    setTimeout(() => setSyncStatus(''), 2000);
                } catch (error) {
                    setSyncStatus('✗ Error al sincronizar');
                    console.error('Error saving cases:', error);
                }
            };

            const deleteCase = (id) => {
                if (confirm('¿Estás seguro de que quieres eliminar este caso?')) {
                    const caseToDelete = cases.find(c => c.id === id);
                    const updated = cases.filter(c => c.id !== id);
                    setCases(updated);

                    // Eliminar del lugar correcto
                    if (caseToDelete._source === 'library') {
                        db.collection('library').doc(id).delete();
                    } else {
                        saveCases(updated);
                    }
                    setSelectedCase(null);
                }
            };

            const initializeNewCase = () => {
                setNewCaseForm({
                    id: '',
                    patientType: 'neonatal',
                    title: { es: '', en: '', pt: '' },
                    presentation: { es: '', en: '', pt: '' },
                    stages: [{ name: { es: '', en: '', pt: '' }, hr: 100, spo2: 95, transition: 5 }]
                });
                setCreatingCase(true);
                setSelectedCase(null);
                setEditingCase(null);
            };

            const createCase = () => {
                if (!newCaseForm.id.trim()) {
                    alert('El ID es requerido');
                    return;
                }
                if (cases.some(c => c.id === newCaseForm.id)) {
                    alert('Ya existe un caso con este ID');
                    return;
                }
                if (!newCaseForm.stages || newCaseForm.stages.length === 0) {
                    alert('Debe haber al menos una etapa');
                    return;
                }
                const updated = [...cases, newCaseForm];
                setCases(updated);
                saveCases(updated);
                setCreatingCase(false);
                setSelectedCase(newCaseForm);
                setNewCaseForm(null);
            };

            const addStage = () => {
                setNewCaseForm({
                    ...newCaseForm,
                    stages: [...newCaseForm.stages, { name: { es: '', en: '', pt: '' }, hr: 100, spo2: 95, transition: 5 }]
                });
            };

            const removeStage = (idx) => {
                setNewCaseForm({
                    ...newCaseForm,
                    stages: newCaseForm.stages.filter((_, i) => i !== idx)
                });
            };

            const updateStageInForm = (idx, field, value) => {
                const updated = { ...newCaseForm };
                if (field.startsWith('name.')) {
                    const lang = field.split('.')[1];
                    updated.stages[idx].name[lang] = value;
                } else {
                    updated.stages[idx][field] = field === 'transition' || field === 'hr' || field === 'spo2' ? parseInt(value) || 0 : value;
                }
                setNewCaseForm(updated);
            };

            const updateStage = (stageIndex, field, value) => {
                const updated = { ...editingCase };
                updated.stages[stageIndex][field] = value;
                setEditingCase(updated);
            };

            const addStageToEdit = () => {
                const updated = { ...editingCase };
                updated.stages.push({ name: { es: '', en: '', pt: '' }, hr: 100, spo2: 95, transition: 5 });
                setEditingCase(updated);
            };

            const removeStageFromEdit = (idx) => {
                const updated = { ...editingCase };
                updated.stages.splice(idx, 1);
                setEditingCase(updated);
            };

            const saveEdit = () => {
                const updated = cases.map(c => c.id === editingCase.id ? editingCase : c);
                setCases(updated);
                saveCases(updated);
                setSelectedCase(editingCase);
                setEditingCase(null);
            };

            const patientTypes = { neonatal: 'Neonatal', pediatrico: 'Pediátrico', adulto: 'Adulto' };

            if (loading) {
                return <div className="w-full h-screen flex items-center justify-center text-xl">Cargando casos...</div>;
            }

            return (
                <div className="flex h-screen">
                    {/* Sidebar */}
                    <div className="w-80 bg-slate-900 border-r border-slate-700 overflow-y-auto">
                        <div className="p-6 border-b border-slate-700">
                            <h1 className="text-2xl font-bold mb-1">NeoMonitor</h1>
                            <p className="text-slate-400 text-sm">Gestión de Casos</p>
                        </div>

                        <div className="p-4">
                            <button
                                onClick={initializeNewCase}
                                className="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded mb-4 text-sm"
                            >
                                + Nuevo caso
                            </button>
                        </div>

                        <div className="p-4 space-y-2">
                            {cases.map(c => (
                                <button
                                    key={c.id}
                                    onClick={() => {
                                        setSelectedCase(c);
                                        setEditingCase(null);
                                    }}
                                    className={`w-full text-left p-3 rounded border transition ${
                                        selectedCase?.id === c.id
                                            ? 'bg-blue-600 border-blue-400'
                                            : 'bg-slate-800 border-slate-700 hover:border-slate-600'
                                    }`}
                                >
                                    <div className="font-semibold">{typeof c.title === 'object' ? c.title.es : c.title}</div>
                                    <div className="text-xs text-slate-400 flex items-center gap-2">
                                        <span>{patientTypes[c.patientType]}</span>
                                        {c._source === 'library' && <span className="bg-green-800 text-green-100 px-1.5 py-0.5 rounded text-[10px]">Comunidad</span>}
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex flex-col">
                        {/* Header */}
                        <div className="bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center">
                            <div>
                                {selectedCase ? (
                                    <div>
                                        <h2 className="text-2xl font-bold">{selectedCase.title.es}</h2>
                                        <p className="text-slate-400 text-sm">{patientTypes[selectedCase.patientType]}</p>
                                    </div>
                                ) : (
                                    <p className="text-slate-400">Selecciona un caso para editar</p>
                                )}
                            </div>
                            <div className="flex gap-2 items-center">
                                <span className="text-sm text-slate-400">{syncStatus}</span>
                                <button
                                    onClick={onLogout}
                                    className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded text-sm"
                                >
                                    Cerrar sesión
                                </button>
                            </div>
                        </div>

                        {/* Editor */}
                        <div className="flex-1 overflow-y-auto p-6">
                            {creatingCase && newCaseForm ? (
                                <div className="max-w-4xl space-y-6">
                                    <h2 className="text-2xl font-bold mb-6">Crear nuevo caso clínico</h2>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">ID (ej: rcp_basica)</label>
                                            <input
                                                type="text"
                                                value={newCaseForm.id}
                                                onChange={(e) => setNewCaseForm({ ...newCaseForm, id: e.target.value.toLowerCase().replace(/\s+/g, '_') })}
                                                placeholder="snake_case"
                                                className="w-full"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">Tipo de Paciente</label>
                                            <select
                                                value={newCaseForm.patientType}
                                                onChange={(e) => setNewCaseForm({ ...newCaseForm, patientType: e.target.value })}
                                                className="w-full"
                                            >
                                                <option value="neonatal">Neonatal</option>
                                                <option value="pediatrico">Pediátrico</option>
                                                <option value="adulto">Adulto</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div>
                                        <h3 className="text-lg font-semibold mb-3">Título</h3>
                                        <div className="grid grid-cols-3 gap-4">
                                            {['es', 'en', 'pt'].map(lang => (
                                                <div key={lang}>
                                                    <label className="block text-sm mb-1">{lang.toUpperCase()}</label>
                                                    <input
                                                        type="text"
                                                        value={newCaseForm.title[lang]}
                                                        onChange={(e) => setNewCaseForm({
                                                            ...newCaseForm,
                                                            title: { ...newCaseForm.title, [lang]: e.target.value }
                                                        })}
                                                        className="w-full"
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <h3 className="text-lg font-semibold mb-3">Presentación</h3>
                                        <div className="space-y-2">
                                            {['es', 'en', 'pt'].map(lang => (
                                                <div key={lang}>
                                                    <label className="block text-sm mb-1">{lang.toUpperCase()}</label>
                                                    <textarea
                                                        value={newCaseForm.presentation[lang]}
                                                        onChange={(e) => setNewCaseForm({
                                                            ...newCaseForm,
                                                            presentation: { ...newCaseForm.presentation, [lang]: e.target.value }
                                                        })}
                                                        className="w-full h-20"
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between items-center mb-3">
                                            <h3 className="text-lg font-semibold">Etapas</h3>
                                            <button
                                                onClick={addStage}
                                                className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm"
                                            >
                                                + Agregar etapa
                                            </button>
                                        </div>

                                        <div className="space-y-4">
                                            {newCaseForm.stages.map((stage, idx) => (
                                                <div key={idx} className="bg-slate-800 p-4 rounded border border-slate-700">
                                                    <div className="flex justify-between items-center mb-3">
                                                        <h4 className="font-semibold">Etapa {idx + 1}</h4>
                                                        {newCaseForm.stages.length > 1 && (
                                                            <button
                                                                onClick={() => removeStage(idx)}
                                                                className="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded text-sm"
                                                            >
                                                                Eliminar
                                                            </button>
                                                        )}
                                                    </div>

                                                    <div className="grid grid-cols-3 gap-2 mb-3">
                                                        {['es', 'en', 'pt'].map(lang => (
                                                            <input
                                                                key={lang}
                                                                type="text"
                                                                value={stage.name[lang]}
                                                                onChange={(e) => updateStageInForm(idx, `name.${lang}`, e.target.value)}
                                                                placeholder={`Nombre ${lang.toUpperCase()}`}
                                                                className="text-sm"
                                                            />
                                                        ))}
                                                    </div>

                                                    <div className="grid grid-cols-3 gap-2">
                                                        <input
                                                            type="number"
                                                            value={stage.hr}
                                                            onChange={(e) => updateStageInForm(idx, 'hr', e.target.value)}
                                                            placeholder="HR"
                                                            className="text-sm"
                                                        />
                                                        <input
                                                            type="number"
                                                            value={stage.spo2}
                                                            onChange={(e) => updateStageInForm(idx, 'spo2', e.target.value)}
                                                            placeholder="SpO2"
                                                            className="text-sm"
                                                        />
                                                        <input
                                                            type="number"
                                                            value={stage.transition}
                                                            onChange={(e) => updateStageInForm(idx, 'transition', e.target.value)}
                                                            placeholder="Transición (s)"
                                                            className="text-sm"
                                                        />
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex gap-2 pt-4">
                                        <button
                                            onClick={createCase}
                                            className="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded font-semibold"
                                        >
                                            Crear caso
                                        </button>
                                        <button
                                            onClick={() => {
                                                setCreatingCase(false);
                                                setNewCaseForm(null);
                                            }}
                                            className="bg-slate-600 hover:bg-slate-700 text-white px-6 py-2 rounded"
                                        >
                                            Cancelar
                                        </button>
                                    </div>
                                </div>
                            ) : editingCase ? (
                                <div className="max-w-4xl space-y-6">
                                    <div>
                                        <label className="block text-sm font-semibold mb-2">ID (no editable)</label>
                                        <input type="text" value={editingCase.id} disabled className="w-full opacity-50" />
                                    </div>

                                    <div className="grid grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">Título ES</label>
                                            <input
                                                type="text"
                                                value={editingCase.title.es}
                                                onChange={(e) => setEditingCase({
                                                    ...editingCase,
                                                    title: { ...editingCase.title, es: e.target.value }
                                                })}
                                                className="w-full"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">Título EN</label>
                                            <input
                                                type="text"
                                                value={editingCase.title.en}
                                                onChange={(e) => setEditingCase({
                                                    ...editingCase,
                                                    title: { ...editingCase.title, en: e.target.value }
                                                })}
                                                className="w-full"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">Título PT</label>
                                            <input
                                                type="text"
                                                value={editingCase.title.pt}
                                                onChange={(e) => setEditingCase({
                                                    ...editingCase,
                                                    title: { ...editingCase.title, pt: e.target.value }
                                                })}
                                                className="w-full"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">Presentación ES</label>
                                            <textarea
                                                value={editingCase.presentation.es}
                                                onChange={(e) => setEditingCase({
                                                    ...editingCase,
                                                    presentation: { ...editingCase.presentation, es: e.target.value }
                                                })}
                                                className="w-full h-24"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">Presentación EN</label>
                                            <textarea
                                                value={editingCase.presentation.en}
                                                onChange={(e) => setEditingCase({
                                                    ...editingCase,
                                                    presentation: { ...editingCase.presentation, en: e.target.value }
                                                })}
                                                className="w-full h-24"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold mb-2">Presentación PT</label>
                                            <textarea
                                                value={editingCase.presentation.pt}
                                                onChange={(e) => setEditingCase({
                                                    ...editingCase,
                                                    presentation: { ...editingCase.presentation, pt: e.target.value }
                                                })}
                                                className="w-full h-24"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="text-lg font-semibold">Etapas</h3>
                                            <button
                                                onClick={addStageToEdit}
                                                className="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1 rounded text-sm"
                                            >
                                                + Agregar etapa
                                            </button>
                                        </div>
                                        <div className="space-y-4">
                                            {editingCase.stages.map((stage, idx) => (
                                                <div key={idx} className="bg-slate-800 p-4 rounded border border-slate-700">
                                                    <div className="grid grid-cols-3 gap-4 mb-3">
                                                        <input
                                                            type="text"
                                                            value={stage.name.es}
                                                            onChange={(e) => updateStage(idx, 'name', { ...stage.name, es: e.target.value })}
                                                            placeholder="Nombre ES"
                                                        />
                                                        <input
                                                            type="text"
                                                            value={stage.name.en}
                                                            onChange={(e) => updateStage(idx, 'name', { ...stage.name, en: e.target.value })}
                                                            placeholder="Nombre EN"
                                                        />
                                                        <input
                                                            type="text"
                                                            value={stage.name.pt}
                                                            onChange={(e) => updateStage(idx, 'name', { ...stage.name, pt: e.target.value })}
                                                            placeholder="Nombre PT"
                                                        />
                                                    </div>
                                                    <div className="grid grid-cols-3 gap-4">
                                                        <div>
                                                            <label className="text-xs text-slate-400">HR</label>
                                                            <input
                                                                type="number"
                                                                value={stage.hr}
                                                                onChange={(e) => updateStage(idx, 'hr', parseInt(e.target.value))}
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="text-xs text-slate-400">SpO2</label>
                                                            <input
                                                                type="number"
                                                                value={stage.spo2}
                                                                onChange={(e) => updateStage(idx, 'spo2', parseInt(e.target.value))}
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="text-xs text-slate-400">Transición (s)</label>
                                                            <input
                                                                type="number"
                                                                value={stage.transition}
                                                                onChange={(e) => updateStage(idx, 'transition', parseInt(e.target.value))}
                                                            />
                                                        </div>
                                                    </div>
                                                    <div className="flex justify-end gap-2 mt-3">
                                                        <button
                                                            onClick={() => removeStageFromEdit(idx)}
                                                            className="bg-red-600 hover:bg-red-700 text-white px-2 py-1 rounded text-xs"
                                                        >
                                                            Eliminar etapa
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="flex gap-2 pt-4">
                                        <button
                                            onClick={saveEdit}
                                            className="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded font-semibold"
                                        >
                                            Guardar Cambios
                                        </button>
                                        <button
                                            onClick={() => setEditingCase(null)}
                                            className="bg-slate-700 hover:bg-slate-600 text-white px-6 py-2 rounded"
                                        >
                                            Cancelar
                                        </button>
                                    </div>
                                </div>
                            ) : selectedCase ? (
                                <div className="max-w-4xl space-y-4">
                                    {selectedCase._source === 'library' && (
                                        <div className="bg-green-900/30 border border-green-700 p-3 rounded">
                                            <p className="text-sm text-green-300">
                                                <span className="font-semibold">Caso de comunidad</span> • Creado por: {selectedCase.authorName || selectedCase.userEmail || 'anónimo'}
                                            </p>
                                        </div>
                                    )}

                                    <div className="bg-slate-800 p-4 rounded border border-slate-700">
                                        <h3 className="text-lg font-semibold mb-2">Presentación</h3>
                                        <p className="text-slate-300 whitespace-pre-wrap">{typeof selectedCase.presentation === 'object' ? selectedCase.presentation.es : selectedCase.presentation}</p>
                                    </div>

                                    <div className="bg-slate-800 p-4 rounded border border-slate-700">
                                        <h3 className="text-lg font-semibold mb-4">Etapas ({selectedCase.stages.length})</h3>
                                        <div className="space-y-2">
                                            {selectedCase.stages.map((stage, idx) => {
                                                const stageName = typeof stage.name === 'object' ? (stage.name.es || `Etapa ${idx + 1}`) : stage.name || `Etapa ${idx + 1}`;
                                                return (
                                                    <div key={idx} className="bg-slate-700/50 p-3 rounded flex justify-between items-center">
                                                        <div>
                                                            <div className="font-semibold">{stageName}</div>
                                                            <div className="text-sm text-slate-400">HR: {stage.hr} | SpO2: {stage.spo2}% | Transición: {stage.transition}s</div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    <div className="flex gap-2 pt-4">
                                        <button
                                            onClick={() => setEditingCase(normalizeCases([selectedCase])[0])}
                                            className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded font-semibold"
                                        >
                                            Editar
                                        </button>
                                        <button
                                            onClick={() => deleteCase(selectedCase.id)}
                                            className="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded"
                                        >
                                            Eliminar
                                        </button>
                                    </div>
                                </div>
                            ) : null}
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [authenticated, setAuthenticated] = useState(
                localStorage.getItem('neomonitor_admin_auth') === 'true'
            );

            const handleLogout = () => {
                localStorage.removeItem('neomonitor_admin_auth');
                setAuthenticated(false);
            };

            return authenticated ? (
                <AdminPanel onLogout={handleLogout} />
            ) : (
                <LoginPage onAuthenticate={() => setAuthenticated(true)} />
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
