<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoSim Monitor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para traducir React -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FIREBASE COMPAT (Funciona sin servidor local) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        body { background-color: #0f172a; color: white; }
        @keyframes pulse-fast {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-fast { animation: pulse-fast 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        /* Animación para el mensaje de error */
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // 1. CONFIGURACIÓN (PEGAR TUS LLAVES AQUÍ)
        // ==========================================
       const firebaseConfig = {
  apiKey: "AIzaSyA46SqiHL-U13mdaJnee-KhD372aWc5h2E",
  authDomain: "monitor-36c41.firebaseapp.com",
  projectId: "monitor-36c41",
  storageBucket: "monitor-36c41.firebasestorage.app",
  messagingSenderId: "830562769122",
  appId: "1:830562769122:web:1db7060de0c80556db66bb"
};
        // ==========================================

        // Inicialización de Firebase (Modo Compatibilidad)
        let db, auth;
        // CORRECCIÓN: Usamos firebaseConfig en lugar de YOUR_FIREBASE_CONFIG
        const isConfigured = firebaseConfig.apiKey !== "TU_API_KEY_AQUI";

        if (isConfigured && typeof firebase !== 'undefined') {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();
                auth = firebase.auth();
                console.log("Firebase iniciado correctamente");
            } catch (error) {
                console.error("Error iniciando Firebase:", error);
            }
        }

        const { useState, useEffect, useRef } = React;

        // --- ICONOS SVG ---
        const Icons = {
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            Heart: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>,
            Wind: ({className, style}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>,
            Monitor: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>,
            Smartphone: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>,
            AlertTriangle: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
            Wifi: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>,
            Volume2: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>,
            VolumeX: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" x2="17" y1="9" y2="15"/><line x1="17" x2="23" y1="9" y2="15"/></svg>
        };

        const DEFAULT_VITALS = { hr: 140, spo2: 98, resp: 45, alarmMuted: false, connected: true };

        // --- COMPONENTES ---

        // Canvas de Ondas
        const WaveformCanvas = ({ color, speed, type, flatline }) => {
            const canvasRef = useRef(null);
            const dataRef = useRef([]);
            const phaseRef = useRef(0);
            const frameRef = useRef(0);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                if (dataRef.current.length === 0) dataRef.current = new Array(canvas.width).fill(canvas.height / 2);

                const draw = () => {
                    if (canvas.width !== canvas.offsetWidth) {
                        canvas.width = canvas.offsetWidth;
                        canvas.height = canvas.offsetHeight;
                        dataRef.current = new Array(canvas.width).fill(canvas.height / 2);
                    }

                    let newValue = canvas.height / 2;
                    const amplitude = canvas.height / 3;
                    
                    if (!flatline) {
                        const speedFactor = (speed / 60) * 0.15;
                        phaseRef.current += speedFactor;
                        const p = phaseRef.current % (2 * Math.PI);

                        if (type === 'ecg') {
                            if (p > 2.8 && p < 3.2) {
                                newValue = (canvas.height / 2) - (Math.sin((p - 3) * 20) * amplitude * 1.5 * Math.exp(-Math.pow(p - 3, 2) * 100));
                            } else {
                                newValue = (canvas.height / 2) + (Math.sin(p) * (amplitude * 0.1)) + (Math.random() * 2);
                            }
                        } else {
                            const wave = Math.sin(p) + 0.5 * Math.sin(2 * p + 0.5);
                            newValue = (canvas.height / 2) - (wave * amplitude * 0.6);
                        }
                    } else {
                        newValue = (canvas.height / 2) + (Math.random() * 2 - 1);
                    }

                    dataRef.current.push(newValue);
                    dataRef.current.shift();

                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = color;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    for (let i = 0; i < dataRef.current.length; i++) {
                        if (i === 0) ctx.moveTo(i, dataRef.current[i]);
                        else ctx.lineTo(i, dataRef.current[i]);
                    }
                    ctx.stroke();
                    frameRef.current = requestAnimationFrame(draw);
                };
                frameRef.current = requestAnimationFrame(draw);
                return () => cancelAnimationFrame(frameRef.current);
            }, [color, speed, type, flatline]);

            return <canvas ref={canvasRef} className="w-full h-full block"></canvas>;
        };

        // Pantalla Selección
        const RoleSelection = ({ onSelect }) => {
            const [sessionId, setSessionId] = useState('');
            return (
                <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-4">
                    <div className="max-w-md w-full bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
                        <div className="flex justify-center mb-6"><Icons.Activity /></div>
                        <h1 className="text-3xl font-bold text-center mb-2 text-emerald-400">NeoSim</h1>
                        <p className="text-slate-400 text-center mb-8">Si no configuraste Firebase, funcionará en modo DEMO.</p>
                        <div className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-2">Código de Sesión</label>
                                <div className="flex gap-2">
                                    <input type="number" value={sessionId} onChange={(e) => setSessionId(e.target.value)} placeholder="Ej: 1234" className="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white text-center text-xl outline-none" />
                                    <button onClick={() => setSessionId(Math.floor(1000 + Math.random() * 9000).toString())} className="px-4 py-2 bg-slate-700 rounded-lg text-sm hover:bg-slate-600">Generar</button>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <button onClick={() => sessionId && onSelect('monitor', sessionId)} disabled={!sessionId} className="flex flex-col items-center p-6 bg-slate-700 hover:bg-slate-600 rounded-xl transition-all disabled:opacity-50">
                                    <Icons.Monitor className="w-8 h-8 mb-3 text-emerald-400" />
                                    <span className="font-semibold">Monitor</span>
                                </button>
                                <button onClick={() => sessionId && onSelect('control', sessionId)} disabled={!sessionId} className="flex flex-col items-center p-6 bg-slate-700 hover:bg-slate-600 rounded-xl transition-all disabled:opacity-50">
                                    <Icons.Smartphone className="w-8 h-8 mb-3 text-blue-400" />
                                    <span className="font-semibold">Control</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Pantalla Monitor
        const MonitorScreen = ({ sessionId, vitals }) => {
            const [alarmState, setAlarmState] = useState('none');
            const [flash, setFlash] = useState(false);

            useEffect(() => {
                let level = 'none';
                if (vitals.hr < 60 || vitals.hr === 0 || vitals.spo2 < 80) level = 'critical';
                else if (vitals.hr < 100 || vitals.hr > 180 || vitals.spo2 < 90) level = 'warning';
                setAlarmState(level);
                
                const interval = setInterval(() => setFlash(p => !p), level === 'critical' ? 300 : 800);
                return () => clearInterval(interval);
            }, [vitals.hr, vitals.spo2]);

            const getBorderColor = () => {
                if (alarmState === 'none' || vitals.alarmMuted) return 'border-transparent';
                if (alarmState === 'critical') return flash ? 'border-red-600 bg-red-900/20' : 'border-red-900';
                return flash ? 'border-yellow-500 bg-yellow-900/20' : 'border-yellow-900';
            };

            const getTextColor = (base) => (alarmState !== 'none' && !vitals.alarmMuted && flash) ? 'text-white' : base;

            return (
                <div className={`w-full h-screen bg-black flex flex-col border-[12px] ${getBorderColor()} transition-colors duration-100 overflow-hidden`}>
                    <div className="flex justify-between px-4 py-2 bg-slate-900/50 text-slate-400 text-sm font-mono border-b border-slate-800">
                        <div className="flex gap-4"><span>NEONATAL</span><span>CAMA: 01</span></div>
                        <div className="flex gap-2 items-center">
                             {vitals.alarmMuted && <Icons.VolumeX className="text-orange-500 w-4 h-4" />}
                             <span>ID: {sessionId}</span>
                        </div>
                    </div>

                    <div className="flex-1 grid grid-rows-3 divide-y divide-slate-800">
                        {/* ECG */}
                        <div className="grid grid-cols-[70%_30%] h-full">
                            <div className="relative h-full border-r border-slate-800 bg-black">
                                <span className="absolute top-2 left-2 text-emerald-500 font-bold text-sm z-10">II</span>
                                <WaveformCanvas color="#10b981" speed={vitals.hr} type="ecg" flatline={vitals.hr === 0} />
                            </div>
                            <div className="flex flex-col justify-center items-end pr-8 relative">
                                <span className="absolute top-2 right-2 text-emerald-500 font-bold text-lg">FC</span>
                                <span className={`text-[6rem] lg:text-[8rem] leading-none font-mono font-bold ${getTextColor('text-emerald-500')}`}>{vitals.hr}</span>
                            </div>
                        </div>
                        {/* SpO2 */}
                        <div className="grid grid-cols-[70%_30%] h-full">
                            <div className="relative h-full border-r border-slate-800 bg-black">
                                <span className="absolute top-2 left-2 text-cyan-500 font-bold text-sm z-10">Pleth</span>
                                <WaveformCanvas color="#06b6d4" speed={vitals.hr} type="pleth" flatline={vitals.spo2 === 0} />
                            </div>
                            <div className="flex flex-col justify-center items-end pr-8 relative">
                                <span className="absolute top-2 right-2 text-cyan-500 font-bold text-lg">SpO2</span>
                                <span className={`text-[6rem] lg:text-[8rem] leading-none font-mono font-bold ${getTextColor('text-cyan-500')}`}>{vitals.spo2}<span className="text-4xl ml-2">%</span></span>
                            </div>
                        </div>
                        {/* Other */}
                        <div className="grid grid-cols-2 h-full divide-x divide-slate-800">
                             <div className="flex flex-col justify-center items-end pr-8 relative">
                                <span className="absolute top-2 left-4 text-yellow-500 font-bold text-lg">RESP</span>
                                <div className="flex items-center gap-4">
                                    <Icons.Wind className={`w-8 h-8 text-slate-600 ${vitals.hr > 0 ? 'animate-pulse-fast' : ''}`} />
                                    <span className="text-[5rem] lg:text-[6rem] leading-none font-mono font-bold text-yellow-500">{vitals.resp}</span>
                                </div>
                             </div>
                             <div className="flex flex-col justify-center pl-8 relative">
                                <span className="absolute top-2 left-4 text-white font-bold text-lg">PNI</span>
                                <span className="text-[4rem] font-mono font-bold text-white">{vitals.hr > 0 ? '65/42' : '--/--'}</span>
                                <span className="text-slate-500">(51)</span>
                             </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Pantalla Controlador
        const ControllerScreen = ({ sessionId, vitals, onUpdate }) => {
            return (
                <div className="min-h-screen bg-slate-900 text-white p-4 pb-20">
                    <header className="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-lg">
                        <h2 className="font-bold text-blue-400 flex items-center gap-2"><Icons.Wifi className="w-4 h-4"/> Control Remoto</h2>
                        <div className={`w-3 h-3 rounded-full ${vitals.connected ? 'bg-green-500' : 'bg-red-500'}`}></div>
                    </header>
                    
                    <div className="space-y-6 max-w-lg mx-auto">
                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700">
                            <div className="flex justify-between mb-4">
                                <label className="text-emerald-400 font-bold flex gap-2"><Icons.Heart className="w-5 h-5"/> FC: {vitals.hr}</label>
                            </div>
                            <input type="range" min="0" max="250" value={vitals.hr} onChange={(e) => onUpdate({hr: parseInt(e.target.value)})} className="w-full h-12 accent-emerald-500 cursor-pointer" />
                        </div>

                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700">
                            <div className="flex justify-between mb-4">
                                <label className="text-cyan-400 font-bold flex gap-2"><Icons.Activity className="w-5 h-5"/> SpO2: {vitals.spo2}%</label>
                            </div>
                            <input type="range" min="0" max="100" value={vitals.spo2} onChange={(e) => onUpdate({spo2: parseInt(e.target.value)})} className="w-full h-12 accent-cyan-500 cursor-pointer" />
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                            <button onClick={() => onUpdate({hr: 140, spo2: 98, resp: 45})} className="p-4 bg-emerald-900/40 border border-emerald-500/50 rounded-lg text-emerald-400 font-bold">Normal</button>
                            <button onClick={() => onUpdate({hr: 60, spo2: 85, resp: 20})} className="p-4 bg-yellow-900/40 border border-yellow-500/50 rounded-lg text-yellow-400 font-bold">Bradicardia</button>
                            <button onClick={() => onUpdate({hr: 150, spo2: 65, resp: 60})} className="p-4 bg-blue-900/40 border border-blue-500/50 rounded-lg text-blue-400 font-bold">Desaturación</button>
                            <button onClick={() => onUpdate({hr: 0, spo2: 0, resp: 0})} className="p-4 bg-red-900/40 border border-red-500/50 rounded-lg text-red-500 font-bold flex items-center justify-center gap-2"><Icons.AlertTriangle className="w-4 h-4"/> PARO</button>
                        </div>
                        
                        <button onClick={() => onUpdate({ alarmMuted: !vitals.alarmMuted })} className={`w-full py-4 rounded-lg font-bold flex justify-center gap-2 ${vitals.alarmMuted ? 'bg-orange-600' : 'bg-slate-700'}`}>
                             {vitals.alarmMuted ? 'Alarmas Silenciadas' : 'Silenciar Alarmas'}
                        </button>
                    </div>
                </div>
            );
        };

        // App Principal
        const App = () => {
            const [mode, setMode] = useState('select');
            const [sessionId, setSessionId] = useState('');
            const [vitals, setVitals] = useState(DEFAULT_VITALS);
            const [user, setUser] = useState(null);

            // Manejo de Error: Si no pusiste las llaves
            if (!isConfigured) {
                return (
                    <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-8 text-center fade-in">
                        <Icons.AlertTriangle className="w-16 h-16 text-yellow-500 mb-4" />
                        <h1 className="text-3xl font-bold mb-4">Falta Configuración</h1>
                        <p className="text-slate-400 max-w-md mb-8">
                            Para usar este monitor, debes abrir el archivo <code>index.html</code> con un editor de texto y pegar tus credenciales de Firebase donde dice <code>TU_API_KEY_AQUI</code>.
                        </p>
                        <div className="bg-slate-800 p-4 rounded text-left font-mono text-xs text-emerald-400 w-full max-w-md overflow-auto">
                            const YOUR_FIREBASE_CONFIG = &#123;<br/>
                            &nbsp;&nbsp;apiKey: "PEGAR_AQUI",<br/>
                            &nbsp;&nbsp;...<br/>
                            &#125;
                        </div>
                    </div>
                );
            }

            useEffect(() => {
                auth.signInAnonymously().catch(err => console.error("Error Auth:", err));
                const unsubscribe = auth.onAuthStateChanged(setUser);
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!sessionId || !user) return;
                
                // Firestore Listen (Compat syntax)
                const unsubscribe = db.collection("sessions").doc(sessionId)
                    .onSnapshot((doc) => {
                        if (doc.exists) setVitals({...doc.data(), connected: true});
                    }, (error) => console.log("Esperando conexión...", error));

                return () => unsubscribe();
            }, [sessionId, user]);

            const handleUpdate = async (newVitals) => {
                const updated = { ...vitals, ...newVitals };
                setVitals(updated);
                
                if (sessionId) {
                    // Firestore Write (Compat syntax)
                    await db.collection("sessions").doc(sessionId).set(updated, { merge: true });
                }
            };

            const onSelect = (m, id) => {
                setMode(m);
                setSessionId(id);
            };

            if (!user) return <div className="h-screen w-full flex items-center justify-center text-white bg-slate-900">Conectando...</div>;

            return (
                <div className="font-sans antialiased">
                    {mode === 'select' && <RoleSelection onSelect={onSelect} />}
                    {mode === 'monitor' && <MonitorScreen sessionId={sessionId} vitals={vitals} />}
                    {mode === 'control' && <ControllerScreen sessionId={sessionId} vitals={vitals} onUpdate={handleUpdate} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
