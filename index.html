        input[type=range] { accent-color: #42B334; }
        input[type=range].time-slider { accent-color: #f59e0b; }
        
        .sponsor-container {
            background: transparent;
            border: 1px solid rgba(71, 85, 105, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.3s;
            cursor: pointer;
            border-radius: 4px;
        }
        .sponsor-container:hover { background: rgba(255,255,255,0.05); border-color: #475569; }

        .hardware-accelerated { transform: translateZ(0); will-change: transform, opacity; }
        
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .animate-zoom { animation: zoomIn 0.3s ease-out forwards; }

        @keyframes deviceFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .float-anim { animation: deviceFloat 3s ease-in-out infinite; }
        
        @keyframes scanLine { 0% { top: 0; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        .scan-line { position: absolute; width: 100%; height: 2px; background: #3b82f6; animation: scanLine 2s linear infinite; }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            60% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        .heart-portrait { display: none; }

        @media (max-width: 600px) and (orientation: portrait) {
            .monitor-screen { border-width: 4px !important; }
            .waveform-col { display: none !important; }
            .monitor-screen .main-row { grid-template-columns: 1fr !important; }
            .monitor-screen .number-container { align-items: center !important; padding-right: 0 !important; justify-content: center !important; }
            .monitor-screen .number-label { font-size: 1.2rem !important; margin-bottom: 0px !important; }
            .monitor-screen .number-display { font-size: 22vw !important; }
            .monitor-screen .extra-info-row { grid-template-columns: 1fr 1fr !important; }
            .monitor-screen .sponsor-col { display: none !important; }
            .monitor-screen .qr-button span { display: inline !important; font-size: 0.7rem !important; }
            .heart-portrait { display: block !important; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .monitor-screen { border-width: 4px !important; }
            .monitor-screen .top-bar, .monitor-screen .bottom-bar { padding: 0.2rem 0.5rem !important; font-size: 0.7rem !important; height: 32px !important; }
            .monitor-screen .main-row { grid-template-columns: 1fr 160px !important; }
            .monitor-screen .number-display { font-size: 15vh !important; }
        }

        .qr-button { background: linear-gradient(180deg, #166534 0%, #14532d 100%); border-color: #22c55e; color: #bbf7d0; }
        #reader { width: 100% !important; border: none !important; }
        #reader video { border-radius: 12px !important; object-fit: cover !important; }

        const SponsorSpace = ({ className = "", compact = false, source = "Monitor", t }) => (

        let audioCtx;
        const initAudio = () => {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();

            if (audioCtx.state === 'suspended') audioCtx.resume();
        };

        const playBeep = (pitch = 800) => {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'sine';
            oscillator.frequency.value = pitch;
            const now = audioCtx.currentTime;
            gainNode.gain.setValueAtTime(0.1, now); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            oscillator.start(now);
            oscillator.stop(now + 0.15);
        };

        const playAlarmSequence = (type) => {
             if (!audioCtx || audioCtx.state !== 'running') return;
             const now = audioCtx.currentTime;
             const createTone = (freq, start, duration) => {
                 const osc = audioCtx.createOscillator();
                 const gain = audioCtx.createGain();
                 osc.connect(gain);
                 gain.connect(audioCtx.destination);
                 osc.type = 'square';
                 osc.frequency.value = freq;
                 gain.gain.setValueAtTime(0.08, start);
                 gain.gain.setValueAtTime(0, start + duration);
                 osc.start(start);
                 osc.stop(start + duration);
             };
             if (type === 'critical') {
                 createTone(880, now, 0.1); createTone(880, now + 0.2, 0.1); createTone(880, now + 0.4, 0.1);
             } else if (type === 'warning') {
                 createTone(600, now, 0.2); createTone(600, now + 0.4, 0.2);
             }
        };

        const playGrunt = () => {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(75, now + 0.35);
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.18, now + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.45);
            const osc2 = audioCtx.createOscillator();
            const gain2 = audioCtx.createGain();
            osc2.connect(gain2);
            gain2.connect(audioCtx.destination);
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(280, now);
            osc2.frequency.exponentialRampToValueAtTime(150, now + 0.3);
            gain2.gain.setValueAtTime(0, now);
            gain2.gain.linearRampToValueAtTime(0.07, now + 0.04);
            gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc2.start(now);
            osc2.stop(now + 0.4);
        };

        const WaveformCanvas = ({ color, speed, type, flatline, onBeat, rhythm = 'sinus' }) => {
            const canvasRef = useRef(null);
            const dataRef = useRef([]);
            const phaseRef = useRef(0);
            const lastTimeRef = useRef(performance.now());
            const absolutePhaseRef = useRef(0);
            const nextBeatAbsRef = useRef(Math.PI);
            const lastRRRef = useRef(2 * Math.PI);
            const vfTimeRef = useRef(0);

            useEffect(() => {
                absolutePhaseRef.current = 0;
                nextBeatAbsRef.current = Math.PI;
                lastRRRef.current = 2 * Math.PI;
                vfTimeRef.current = 0;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let frameId;
                const draw = (time) => {
                    const deltaTime = (time - lastTimeRef.current) / 1000;
                    lastTimeRef.current = time;
                    if (deltaTime > 0.1) { frameId = requestAnimationFrame(draw); return; }
                    if (canvas.width !== canvas.offsetWidth) {
                        canvas.width = canvas.offsetWidth;
                        canvas.height = canvas.offsetHeight;
                        dataRef.current = new Array(canvas.width).fill(canvas.height / 2);
                    }
                    let newValue = canvas.height / 2;
                    const amplitude = canvas.height / 3;
                    const mid = canvas.height / 2;
                    const isVF = rhythm === 'vf';
                    const isAFib = rhythm === 'afib';

                    if (isVF) {
                        vfTimeRef.current += deltaTime;
                        const vt = vfTimeRef.current;
                        const coarseDecay = Math.max(0.25, 1.0 - vt / 80);
                        const vfAmpBase = amplitude * 0.75 * coarseDecay;
                        const vfAmp1 = vfAmpBase * (0.7 + 0.3 * Math.abs(Math.sin(vt * 0.4)));
                        const vfAmp2 = vfAmpBase * (0.4 + 0.2 * Math.abs(Math.sin(vt * 0.6 + 1.2)));
                        const vfAmp3 = vfAmpBase * 0.15;
                        newValue = mid - vfAmp1 * Math.sin(vt * 37.7 + 0.3) - vfAmp2 * Math.sin(vt * 25.1 + 1.8) - vfAmp3 * Math.sin(vt * 50.3 + 0.9) + (Math.random() * amplitude * 0.06 - 0.03) * coarseDecay;
                    } else if (!flatline && speed > 0) {
                        vfTimeRef.current += deltaTime;
                        const beatsPerSecond = speed / 60;
                        const prevPhase = phaseRef.current;
                        let phaseIncrement = (beatsPerSecond * 2 * Math.PI) * deltaTime;
                        // HRV: oscilación respiratoria (~0.3 Hz) + jitter aleatorio para sinusal y VT
                        if (type === 'ecg' && !isAFib && !isVF) {
                            const hrModulation = 1.0 + 0.04 * Math.sin(vfTimeRef.current * 0.3) + (Math.random() - 0.5) * 0.04;
                            phaseIncrement *= hrModulation;
                        }
                        phaseRef.current += phaseIncrement;
                        if (phaseRef.current >= 2 * Math.PI) phaseRef.current -= 2 * Math.PI;
                        const p = phaseRef.current;

                        if (type === 'ecg') {
                            if (isAFib) {
                                vfTimeRef.current += deltaTime;
                                const afibTime = vfTimeRef.current;
                                absolutePhaseRef.current += beatsPerSecond * 2 * Math.PI * deltaTime;
                                const absP = absolutePhaseRef.current;
                                const prevAbsP = absP - beatsPerSecond * 2 * Math.PI * deltaTime;
                                const fWaveAmp = amplitude * 0.05 * (0.7 + 0.3 * Math.abs(Math.sin(afibTime * 0.8)));
                                newValue = mid + fWaveAmp * Math.sin(afibTime * 37.7) + fWaveAmp * 0.5 * Math.sin(afibTime * 44.0 + 0.7) + (Math.random() * amplitude * 0.02 - 0.01);
                                const dist = absP - nextBeatAbsRef.current;
                                if (dist > -0.14 && dist < 0.14) {
                                    newValue = mid - amplitude * 2.5 * Math.exp(-dist * dist * 50);
                                } else if (dist > 0.2 && dist < 1.1) {
                                    newValue = mid - amplitude * 0.28 * Math.sin((dist - 0.2) * Math.PI / 0.9);
                                }
                                if (prevAbsP < nextBeatAbsRef.current && absP >= nextBeatAbsRef.current) {
                                    onBeat && onBeat();
                                    const rrVariation = 0.50 + Math.random() * 1.00;
                                    lastRRRef.current = 2 * Math.PI * rrVariation;
                                    nextBeatAbsRef.current = absP + lastRRRef.current;
                                }
                            } else if (rhythm === 'vt') {
                                if (onBeat) {
                                    if (prevPhase < Math.PI && p >= Math.PI) onBeat();
                                }
                                const vtQRS_start = Math.PI - 1.34;
                                const vtQRS_end = Math.PI + 1.34;
                                const vtT_start = 4.78;
                                const vtT_end = 6.08;
                                const inQRS = p > vtQRS_start && p < vtQRS_end;
                                const inT = p > vtT_start && p < vtT_end;
                                if (inQRS) {
                                    const qp = p - Math.PI;
                                    const main = -amplitude * 1.6 * Math.exp(-qp * qp * 0.8);
                                    const notch = amplitude * 0.25 * Math.exp(-Math.pow(qp - 0.8, 2) * 5);
                                    newValue = mid + main + notch;
                                } else if (inT) {
                                    const tp = (p - vtT_start) / (vtT_end - vtT_start);
                                    newValue = mid + amplitude * 0.45 * Math.sin(tp * Math.PI);
                                } else {
                                    newValue = mid + (Math.random() * 1.5 - 0.75);
                                }
                            } else {
                                if (onBeat) {
                                    if (prevPhase < Math.PI && p >= Math.PI) onBeat();
                                }
                                const inP = p > 0.881 && p < 1.633;
                                const inQRS = p > 2.639 && p < 3.644;
                                const inT = p > 3.895 && p < 5.780;
                                if (inP) {
                                    const pp = p - 1.257;
                                    newValue = mid - amplitude * 0.15 * Math.exp(-pp * pp * 7);
                                } else if (inQRS) {
                                    const qp = p - Math.PI;
                                    const R = -amplitude * 2.2 * Math.exp(-qp * qp * 4);
                                    const Q = amplitude * 0.3 * Math.exp(-Math.pow(qp + 0.35, 2) * 30);
                                    const S = amplitude * 0.25 * Math.exp(-Math.pow(qp - 0.35, 2) * 30);
                                    newValue = mid + R + Q + S;
                                } else if (inT) {
                                    const tp = (p - 3.895) / (5.780 - 3.895);
                                    newValue = mid - amplitude * 0.35 * Math.sin(tp * Math.PI);
                                } else {
                                    newValue = mid + (Math.random() * 1.5 - 0.75);
                                }
                            }
                        } else {
                            newValue = mid - Math.sin(p) * amplitude * 0.6;
                        }
                    } else {
                        newValue = mid + (Math.random() * 2 - 1);
                    }
                    dataRef.current.push(newValue);
                    dataRef.current.shift();
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.lineWidth = 2.5; ctx.strokeStyle = color; ctx.beginPath();
                    for (let i = 0; i < dataRef.current.length; i++) {
                        if (i === 0) ctx.moveTo(i, dataRef.current[i]); else ctx.lineTo(i, dataRef.current[i]);
                    }
                    ctx.stroke();
                    frameId = requestAnimationFrame(draw);
                };
                frameId = requestAnimationFrame(draw);
                return () => cancelAnimationFrame(frameId);
            }, [color, speed, type, flatline, onBeat, rhythm]);

            return <canvas ref={canvasRef} className="w-full h-full block" />;
        };

        const useInterpolatedVitals = (target) => {
            const [vitals, setVitals] = useState(target);
            const lastBeatRef = useRef(0);
            const transitionStartRef = useRef(Date.now());
            const targetRef = useRef(target);
            targetRef.current = target;
            useEffect(() => {
                lastBeatRef.current = 0;
                if (!target.transition) { transitionStartRef.current = Date.now(); }
                else { transitionStartRef.current = target.transition.startTime; }
                let frame;
                const animate = () => {
                    const currentTarget = targetRef.current;
                    let trueHr, trueSpo2;
                    if (currentTarget.transition) {
                        const elapsed = Date.now() - currentTarget.transition.startTime;
                        const p = Math.min(1, elapsed / currentTarget.transition.duration);
                        trueHr = Math.round(currentTarget.transition.startHr + (currentTarget.transition.targetHr - currentTarget.transition.startHr) * p);
                        trueSpo2 = Math.round(currentTarget.transition.startSpo2 + (currentTarget.transition.targetSpo2 - currentTarget.transition.startSpo2) * p);
                    } else {
                        trueHr = currentTarget.hr;
                        trueSpo2 = currentTarget.spo2;
                    }
                    const now = Date.now();
                    const beatInterval = trueHr > 0 ? Math.max(400, 60000 / trueHr) : 2000;
                    if (now - lastBeatRef.current >= beatInterval) {
                        lastBeatRef.current = now;
                        const elapsedSec = (now - transitionStartRef.current) / 1000;
                        const respiratoryModulation = Math.sin(elapsedSec * 0.3 * 2 * Math.PI) * 0.04;
                        const randomJitter = (Math.random() - 0.5) * 0.02;
                        const hrModulation = trueHr * (respiratoryModulation + randomJitter);
                        const jitter = trueHr > 0 ? Math.round(hrModulation) : 0;
                        setVitals({ ...currentTarget, hr: Math.max(0, trueHr + jitter), spo2: trueSpo2 });
                    }
                    frame = requestAnimationFrame(animate);
                };
                frame = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(frame);
            }, [target.transition?.duration]);
            return vitals;
        };

        const MonitorScreen = ({ sessionId, vitals: targetVitals, t, patientType = 'neonatal', onPatientTypeChange }) => {
            const vitals = useInterpolatedVitals(targetVitals);
            const [audioEnabled, setAudioEnabled] = useState(false);

            useEffect(() => {
                const t = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(t);

            useEffect(() => {

                setAlarmState(level);

                return () => clearInterval(interval);

                let interval;
                if (audioEnabled && !vitals.alarmMuted && alarmState !== 'none' && vitals.simRunning) {

            }, [alarmState, audioEnabled, vitals.alarmMuted, vitals.simRunning]);

            useEffect(() => {

                if (!audioEnabled || vitals.alarmMuted || !vitals.simRunning) return;

            return (
                <div className={`w-full h-screen bg-black flex flex-col border-[12px] transition-colors duration-100 ${alarmState === 'none' || vitals.alarmMuted || !vitals.simRunning ? 'border-slate-900' : (alarmState === 'critical' ? (flash ? 'border-red-600 bg-red-900/10' : 'border-red-900') : (flash ? 'border-yellow-500 bg-yellow-900/10' : 'border-yellow-900'))} hardware-accelerated monitor-screen`}>

                                        <img src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(controlUrl)}`} alt="Sync" className="w-[180px] h-[180px]" />

                    {qrExpanded && (

                            <div className="bg-white p-4 rounded-2xl shadow-2xl max-w-xs w-full aspect-square flex items-center justify-center relative animate-zoom" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setQrExpanded(false)} className="absolute -top-12 right-0 text-white"><Icons.X className="w-8 h-8" /></button>
                                <img src={`https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(controlUrl)}`} alt="QR" className="w-full h-full" />
                            </div>
                            <p className="mt-6 text-white font-bold text-center px-4">{t.scanPhonePrompt}</p>
                        </div>
                    )}

                    <div className="flex-none flex justify-between px-4 py-2 bg-slate-900/50 text-slate-400 text-sm font-mono border-b border-slate-800 top-bar">
                        <div className="flex gap-4"><span>{t.patientTypes ? t.patientTypes[patientType] : 'NEONATAL'}</span><span>{t.bed}: 01</span></div>
                        <div className="flex gap-4 items-center">{vitals.alarmMuted && <Icons.VolumeX className="text-orange-500 w-4 h-4" />}<span>{t.id}: {sessionId}</span></div>
                    </div>

                    <div className="flex-1 flex flex-col divide-y divide-slate-800 min-h-0">
                        <div className="flex-[1.5] grid grid-cols-[1fr_280px] h-full main-row">
                            <div className="relative border-r border-slate-800 bg-black waveform-col">{vitals.simRunning && <WaveformCanvas color="#42B334" speed={vitals.hr} type="ecg" flatline={vitals.hr === 0 && vitals.rhythm !== 'vf'} onBeat={handleBeat} rhythm={vitals.rhythm || 'sinus'}/>}</div>
                            <div className="flex flex-col items-center px-4 justify-center number-container">
                                <div className="flex items-center gap-3">
                                    <span className="text-[#42B334] font-bold text-lg number-label">{t.hr}</span>
                                    {vitals.simRunning && vitals.hr > 0 && <Icons.Heart className="heart-portrait text-red-600 fill-red-600 w-6 h-6" style={{ animation: `heartbeat ${60/vitals.hr}s infinite cubic-bezier(0.4, 0, 0.2, 1)` }}/>}
                                </div>
                                <span className={`font-mono font-bold leading-none number-display ${alarmState !== 'none' && !vitals.alarmMuted && flash ? 'text-white' : 'text-[#42B334]'}`} style={{fontSize: '18vh'}}>{vitals.simRunning ? (vitals.hr || '--') : '--'}</span>
                            </div>
                        </div>
                        <div className="flex-[1.5] grid grid-cols-[1fr_280px] h-full main-row">
                            <div className="relative border-r border-slate-800 bg-black waveform-col">{vitals.simRunning && <WaveformCanvas color="#facc15" speed={vitals.hr} type="pleth" flatline={vitals.spo2 === 0}/>}</div>
                            <div className="flex flex-col items-center px-4 justify-center number-container">
                                <span className="text-yellow-400 font-bold text-lg number-label">SpO2</span>
                                <span className={`font-mono font-bold leading-none number-display ${alarmState !== 'none' && !vitals.alarmMuted && flash ? 'text-white' : 'text-yellow-400'}`} style={{fontSize: '18vh'}}>{vitals.simRunning ? (vitals.spo2 || '--') : '--'}</span>
                            </div>
                        </div>
                        <div className="flex-1 grid grid-cols-[1fr_1fr_280px] h-full divide-x divide-slate-800 extra-info-row">
                            <div className="flex flex-col justify-center items-center text-slate-600"><span className="text-xs">RESP</span><span className="text-4xl font-bold">---</span></div>

                            <div className="p-2 flex items-center justify-center sponsor-col"><SponsorSpace className="w-full h-full" source="Monitor" t={t} /></div>
                        </div>
                    </div>

                    <div className="flex-none bg-slate-900 p-2 flex justify-between items-center text-xs text-slate-500 bottom-bar">
                        <div className="flex gap-2">
                            <div className="soft-key px-4 py-2">{t.mute}</div>
                            <div className="soft-key px-4 py-2">{t.menu}</div>
                            <div className="soft-key qr-button px-3 py-2 flex items-center gap-1 font-bold" onClick={() => setQrExpanded(true)}><Icons.QrCode className="w-4 h-4" /><span>{t.link}</span></div>
                        </div>
                        <div className="flex-1 flex justify-center opacity-30 font-mono text-[10px] tracking-widest border border-slate-800 mx-4 rounded py-1 bg-black/20">SPONSOR AREA</div>
                        <div className="flex gap-4 items-center font-mono"><span>{time.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span><Icons.Wifi className="w-4 h-4 text-green-500" /><Icons.Battery className="w-4 h-4 text-green-500" /></div>
                    </div>
                </div>
            );
        };

        const CaseEditorModal = ({ caseData, onPublish, onCancel, translating = false, lang = 'es', t = TRANSLATIONS.es }) => {
            const [title, setTitle] = useState(typeof caseData.title === 'string' ? caseData.title : caseData.title?.[lang] || caseData.title?.es || '');
            const [presentation, setPresentation] = useState(typeof caseData.presentation === 'string' ? caseData.presentation : caseData.presentation?.[lang] || caseData.presentation?.es || '');
            const [stages, setStages] = useState(caseData.stages && caseData.stages.length ? caseData.stages.map(s => ({ ...s, name: typeof s.name === 'string' ? s.name : s.name?.[lang] || s.name?.es || '' })) : [{ name: '', hr: 120, spo2: 92, transition: 10 }]);
            const [authorName, setAuthorName] = useState(caseData.authorName || '');
            const [published, setPublished] = useState(false);

            const addStage = () => setStages(prev => [...prev, { name: '', hr: 120, spo2: 92, transition: 10 }]);
            const removeStage = (i) => setStages(prev => prev.filter((_, idx) => idx !== i));
            const updateStage = (i, field, value) => setStages(prev => prev.map((s, idx) => idx === i ? { ...s, [field]: value } : s));
            const buildCase = () => ({ ...caseData, title: title.trim(), presentation: presentation.trim(), stages, authorName: authorName.trim() });
            const handlePublish = () => { if (!title.trim() || stages.length === 0 || !onPublish || translating) return; onPublish(buildCase()); setPublished(true); };

            return (
                <div className="fixed inset-0 bg-black/95 z-[60] p-4 flex flex-col">
                    <div className="bg-slate-800 rounded-xl flex flex-col overflow-hidden max-w-md mx-auto w-full max-h-full">
                        <div className="p-4 border-b border-slate-700 flex justify-between items-center flex-none">
                            <h3 className="font-bold text-white">{caseData._firestore ? t.editCase : t.newCaseTitle}</h3>
                            <button onClick={onCancel}><Icons.X className="w-6 h-6"/></button>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-4">
                            <div>
                                <label className="text-xs text-slate-400 uppercase tracking-widest font-bold mb-1 block">{t.caseTitle}</label>
                                <input type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder={t.titlePlaceholder}
                                    className="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white outline-none focus:border-blue-500"/>
                            </div>
                            <div>
                                <label className="text-xs text-slate-400 uppercase tracking-widest font-bold mb-1 block">{t.presentation}</label>
                                <textarea value={presentation} onChange={e => setPresentation(e.target.value)} placeholder="Descripción clínica del paciente para los alumnos..."
                                    className="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white text-sm outline-none focus:border-blue-500 resize-none" rows={3}/>
                            </div>
                            <div>
                                <label className="text-xs text-slate-400 uppercase tracking-widest font-bold mb-1 block">Autor (opcional)</label>
                                <input type="text" value={authorName} onChange={e => setAuthorName(e.target.value)} placeholder="Tu nombre o institución"
                                    className="w-full bg-slate-700 border border-slate-600 rounded-lg p-3 text-white outline-none focus:border-blue-500"/>
                            </div>
                            <div>
                                <div className="flex justify-between items-center mb-2">
                                    <label className="text-xs text-slate-400 uppercase tracking-widest font-bold">Etapas ({stages.length})</label>
                                    <button onClick={addStage} className="bg-green-700/50 hover:bg-green-700 text-green-300 text-xs px-3 py-1 rounded-full border border-green-500/40 transition-colors">+ Agregar</button>
                                </div>
                                <div className="space-y-3">
                                    {stages.map((stage, i) => (
                                        <div key={i} className="bg-slate-700/50 border border-slate-600 rounded-xl p-3 space-y-2">
                                            <div className="flex justify-between items-center">
                                                <span className="text-xs font-bold text-slate-400">ETAPA {i + 1}</span>
                                                {stages.length > 1 && <button onClick={() => removeStage(i)} className="text-red-400 hover:text-red-300 text-xs px-2">✕</button>}
                                            </div>
                                            <input type="text" value={stage.name} onChange={e => updateStage(i, 'name', e.target.value)} placeholder={t.stageName}
                                                className="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-white text-sm outline-none focus:border-blue-500"/>
                                            <div className="grid grid-cols-3 gap-2">
                                                <div>
                                                    <label className="text-[10px] text-green-400 font-bold block mb-1">FC</label>
                                                    <input type="number" min="0" max="220" value={stage.hr} onChange={e => updateStage(i, 'hr', parseInt(e.target.value) || 0)}
                                                        className="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-white text-sm text-center outline-none focus:border-green-500"/>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-yellow-400 font-bold block mb-1">SpO2%</label>
                                                    <input type="number" min="0" max="100" value={stage.spo2} onChange={e => updateStage(i, 'spo2', parseInt(e.target.value) || 0)}
                                                        className="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-white text-sm text-center outline-none focus:border-yellow-500"/>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-amber-400 font-bold block mb-1">Trans.s</label>
                                                    <input type="number" min="0" max="120" value={stage.transition} onChange={e => updateStage(i, 'transition', parseInt(e.target.value) || 0)}
                                                        className="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-white text-sm text-center outline-none focus:border-amber-500"/>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                        <div className="p-4 border-t border-slate-700 flex flex-col gap-2 flex-none">
                            <div className="flex gap-3">
                                <button onClick={onCancel} disabled={translating} className="flex-1 bg-slate-700 hover:bg-slate-600 disabled:opacity-40 text-white py-3 rounded-xl font-bold transition-colors">{t.cancel}</button>
                                <button onClick={handlePublish} disabled={!title.trim() || published || translating} className="flex-1 bg-green-700 hover:bg-green-600 disabled:opacity-40 disabled:cursor-not-allowed text-white py-3 rounded-xl font-bold transition-colors flex items-center justify-center gap-2">
                                    {translating ? <span className="animate-spin">⟳</span> : published ? t.published : `📤 ${t.publish}`}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ControllerScreen = ({ sessionId, vitals: currentVitals, onUpdate, t, lang, db, userId, userEmail, patientType = 'neonatal', onPatientTypeChange, onLangChange, clinicalCases = [] }) => {
            const vitals = useInterpolatedVitals(currentVitals);
            const [transitionDuration, setTransitionDuration] = useState(5);
            const [showDebrief, setShowDebrief] = useState(false);
            const [eventLog, setEventLog] = useState([]);
            const [localTargets, setLocalTargets] = useState({ hr: currentVitals.hr, spo2: currentVitals.spo2 });
            const [simStartTime, setSimStartTime] = useState(null);
            const [displayTime, setDisplayTime] = useState("00:00");
            const [activeCase, setActiveCase] = useState(null);
            const [stageIndex, setStageIndex] = useState(-1);
            const [showCaseSelector, setShowCaseSelector] = useState(false);
            const [userCases, setUserCases] = useState([]);
            const [showCaseEditor, setShowCaseEditor] = useState(false);
            const [editingCase, setEditingCase] = useState(null);
            const [selectorTab, setSelectorTab] = useState('mis');
            const [libraryCases, setLibraryCases] = useState([]);
            const [libTabPType, setLibTabPType] = useState(patientType);
            const [libraryLoading, setLibraryLoading] = useState(false);
            const [debriefTab, setDebriefTab] = useState('objetivos');
            const [gasNotes, setGasNotes] = useState({ gather: '', analyze: '', summarize: '' });
            const [showPresentation, setShowPresentation] = useState(false);
            const [selectedNTSkills, setSelectedNTSkills] = useState([]);
            const [technicalSkills, setTechnicalSkills] = useState(['', '', '']);
            const [lastApplied, setLastApplied] = useState(null);

            useEffect(() => { setLocalTargets({ hr: currentVitals.hr, spo2: currentVitals.spo2 }); }, [currentVitals.hr, currentVitals.spo2]);

            // Al montarse, señaliza al monitor que el control está conectado
            useEffect(() => { onUpdate({ controlConnected: true }); }, []);

            useEffect(() => {
                let interval;
                if (currentVitals.simRunning) {
                    if (!simStartTime) setSimStartTime(Date.now());
                    interval = setInterval(() => {
                        const start = simStartTime || Date.now();
                        const elapsed = Math.floor((Date.now() - start) / 1000);
                        const mins = Math.floor(elapsed / 60);
                        const secs = elapsed % 60;
                        setDisplayTime(`${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`);
                    }, 1000);
                } else { setSimStartTime(null); setDisplayTime("00:00"); }
                return () => clearInterval(interval);
            }, [currentVitals.simRunning, simStartTime]);

            const [communityCases, setCommunityCases] = useState([]);
            const [translating, setTranslating] = useState(false);

            useEffect(() => {
                if (!db || !userId || userId === 'guest') return;
                const unsub = db.collection('userCases').where('userId', '==', userId).onSnapshot(snap => {
                    setUserCases(snap.docs.map(d => ({ ...d.data(), id: d.id, _firestore: true })));
                });
                return () => unsub();
            }, [db, userId]);

            // Admin: cargar TODOS los casos de comunidad (sin filtro userId)
            useEffect(() => {
                if (!db || userId !== 'diegosteinberg@gmail.com') return;
                const unsub = db.collection('userCases').onSnapshot(snap => {
                    setCommunityCases(snap.docs.map(d => ({ ...d.data(), id: d.id, _firestore: true })));
                });
                return () => unsub();
            }, [db, userId]);

            const getCaseName = (c) => {
                if (!c || !c.title) return 'Sin título';
                if (typeof c.title === 'string') return c.title;
                if (typeof c.title === 'object' && c.title !== null) {
                    const name = c.title[lang] || c.title.es || c.title.en || c.title.pt || '';
                    return name || 'Sin título';
                }
                return 'Sin título';
            };
            const getStageName = (stage) => {
                if (!stage || !stage.name) return '';
                if (typeof stage.name === 'string') return stage.name;
                if (typeof stage.name === 'object' && stage.name !== null) return stage.name[lang] || stage.name.es || stage.name.en || stage.name.pt || '';
                return '';
            };
            const getPresentation = (c) => {
                if (!c || !c.presentation) return null;
                if (typeof c.presentation === 'string') return c.presentation;
                if (typeof c.presentation === 'object' && c.presentation !== null) return c.presentation[lang] || c.presentation.es || c.presentation.en || c.presentation.pt || null;
                return null;
            };
            const patientCfg = PATIENT_CONFIG[patientType] || PATIENT_CONFIG.neonatal;

            const translateText = async (text, targetLang) => {
                if (!text) return '';
                try {
                    // MyMemory Translation API - free, no API key required
                    // Supported language pairs: es|en, es|pt-BR, etc.
                    const langMap = { en: 'en', pt: 'pt-BR' };
                    const targetCode = langMap[targetLang] || targetLang;
                    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=es|${targetCode}`;

                    const response = await fetch(url);
                    const data = await response.json();

                    if (data.responseStatus === 200 && data.responseData?.translatedText) {
                        return data.responseData.translatedText;
                    }
                    console.warn('MyMemory API response:', data);
                    return text; // fallback al texto original
                } catch (err) {
                    console.warn('Translation error:', err?.message);
                    return text; // fallback al texto original
                }
            };

            const translateCaseInternal = async (caseData) => {
                try {
                    const titleEs = typeof caseData.title === 'string' ? caseData.title : caseData.title?.es || '';
                    const presentationEs = typeof caseData.presentation === 'string' ? caseData.presentation : caseData.presentation?.es || '';

                    const [titleEn, titlePt, presentationEn, presentationPt] = await Promise.all([
                        translateText(titleEs, 'en'),
                        translateText(titleEs, 'pt'),
                        translateText(presentationEs, 'en'),
                        translateText(presentationEs, 'pt')
                    ]);

                    const translatedStages = await Promise.all((caseData.stages || []).map(async (stage) => {
                        const stageName = typeof stage.name === 'string' ? stage.name : stage.name?.es || '';
                        const [nameEn, namePt] = await Promise.all([
                            translateText(stageName, 'en'),
                            translateText(stageName, 'pt')
                        ]);
                        return {
                            ...stage,
                            name: { es: stageName, en: nameEn, pt: namePt }
                        };
                    }));

                    return {
                        ...caseData,
                        title: { es: titleEs, en: titleEn, pt: titlePt },
                        presentation: { es: presentationEs, en: presentationEn, pt: presentationPt },
                        stages: translatedStages
                    };
                } catch (err) {
                    console.error('Translation failed:', err);
                    return caseData;
                }
            };

            const translateCase = async (caseData) => {
                setTranslating(true);
                try {
                    return await translateCaseInternal(caseData);
                } finally {
                    setTranslating(false);
                }
            };

            const saveToLibrary = async (caseData) => {
                if (!db) return;
                setTranslating(true);
                try {
                    const translatedCase = await translateCase(caseData);
                    const { _firestore, id, ...clean } = translatedCase;
                    // Asegurar que patientType se incluye al guardar
                    const caseToSave = {
                        ...clean,
                        patientType: clean.patientType || patientType,
                        userId: userId || 'anon',
                        userEmail: userEmail || '',
                        createdAt: Date.now()
                    };
                    await db.collection('library').add(caseToSave);
                    setShowCaseEditor(false);
                    setEditingCase(null);
                } catch (err) {
                    console.error('Error saving to library:', err);
                } finally {
                    setTranslating(false);
                }
            };

            const deleteUserCase = (caseId) => {
                if (!db) return;
                db.collection('userCases').doc(caseId).delete();
                if (activeCase && activeCase.id === caseId) { setActiveCase(null); setStageIndex(-1); }
            };


            useEffect(() => {
                if (!showCaseSelector || selectorTab !== 'biblioteca' || !db) return;
                setLibraryLoading(true);
                const abortCtrl = new AbortController();
                const timeout = setTimeout(() => {
                    if (!abortCtrl.signal.aborted) {
                        abortCtrl.abort();
                        setLibraryLoading(false);
                        console.warn('Library load timeout after 8s');
                    }
                }, 8000);
                try {
                    db.collection('library').orderBy('createdAt', 'desc').limit(100).get()
                        .then(snap => {
                            clearTimeout(timeout);
                            if (!abortCtrl.signal.aborted && snap && snap.docs) {
                                const cases = snap.docs.map(d => ({ ...d.data(), id: d.id }));
                                console.log(`📚 Biblioteca cargada: ${cases.length} casos`);
                                cases.forEach((c, idx) => {
                                    const titleType = typeof c.title;
                                    const titleStr = titleType === 'object' ? JSON.stringify(c.title) : c.title;
                                    console.log(`  [${idx}] Título: ${titleStr}`);
                                    console.log(`       getCaseName() retorna: "${getCaseName(c)}"`);
                                    console.log(`       Lang actual: ${lang}, patientType: ${c.patientType}`);
                                });
                                setLibraryCases(cases);
                                setLibraryLoading(false);
                            }
                        })
                        .catch(err => {
                            clearTimeout(timeout);
                            if (!abortCtrl.signal.aborted) {
                                console.error('Error loading library:', err?.message);
                                setLibraryLoading(false);
                                setLibraryCases([]);
                            }
                        });
                } catch (err) {
                    clearTimeout(timeout);
                    if (!abortCtrl.signal.aborted) {
                        console.error('Library query error:', err?.message);
                        setLibraryLoading(false);
                    }
                }
                return () => {
                    abortCtrl.abort();
                    clearTimeout(timeout);
                };
            }, [showCaseSelector, selectorTab]);

            const logAction = (message, force = false) => {
                if (!currentVitals.simRunning && !force) return;
                const baseTime = (force && !currentVitals.simRunning) ? Date.now() : simStartTime;
                const elapsedTotalSeconds = baseTime ? Math.floor((Date.now() - baseTime) / 1000) : 0;
                const timestamp = `${Math.floor(elapsedTotalSeconds / 60).toString().padStart(2, '0')}:${(elapsedTotalSeconds % 60).toString().padStart(2, '0')}`;
                setEventLog(prev => [...prev, {time: timestamp, msg: message}]);
            };

            const toggleSimulation = () => {
                const isNowRunning = !currentVitals.simRunning;
                if (isNowRunning) { logAction("Simulation Started", true); onUpdate({ ...currentVitals, simRunning: true, transition: null }); trackNeoEvent('sim_start', 'Manual simulation start', { session_id: sessionId }); }
                else { logAction("Simulation Stopped", true); onUpdate({ ...currentVitals, simRunning: false }); trackNeoEvent('sim_stop', 'Manual simulation stop', { session_id: sessionId }); }
            };

            const handleCommitChange = (field, value) => {
                const now = Date.now();
                const durationMs = transitionDuration * 1000;
                logAction(`Changed ${field.toUpperCase()}: ${value}`);
                trackNeoEvent('vital_change', `Manual ${field} update`, { field, value, transition: transitionDuration });
                onUpdate({ ...currentVitals, [field]: value, transition: (durationMs > 0 && currentVitals.simRunning) ? { startTime: now, duration: durationMs, startHr: vitals.hr, targetHr: field === 'hr' ? value : currentVitals.hr, startSpo2: vitals.spo2, targetSpo2: field === 'spo2' ? value : currentVitals.spo2 } : null });
            };

            const advanceStage = () => {
                if (!activeCase || !Array.isArray(activeCase.stages) || activeCase.stages.length === 0) {
                    console.error('Invalid case structure:', activeCase);
                    return;
                }
                const nextIndex = stageIndex + 1;
                if (nextIndex >= activeCase.stages.length) return;
                const stage = activeCase.stages[nextIndex];
                if (!stage || typeof stage.hr !== 'number' || typeof stage.spo2 !== 'number' || typeof stage.transition !== 'number') {
                    console.error('Invalid stage structure:', stage);
                    return;
                }
                const now = Date.now();
                const durationMs = Math.max(0, stage.transition * 1000);
                const stageName = getStageName(stage);
                logAction(`Etapa ${nextIndex + 1}/${activeCase.stages.length}: ${stageName}`);
                trackNeoEvent('case_stage', `Stage ${nextIndex + 1}`, { case: activeCase.id, stage: nextIndex + 1 });
                onUpdate({
                    ...currentVitals,
                    hr: stage.hr,
                    spo2: stage.spo2,
                    transition: durationMs > 0 && currentVitals.simRunning ? {
                        startTime: now,
                        duration: durationMs,
                        startHr: vitals.hr,
                        targetHr: stage.hr,
                        startSpo2: vitals.spo2,
                        targetSpo2: stage.spo2
                    } : null
                });
                setStageIndex(nextIndex);
                setLocalTargets({ hr: stage.hr, spo2: stage.spo2 });
            };

            const applyPreset = (preset) => {
                setLastApplied(preset.key);
                setTimeout(() => setLastApplied(null), 700);
                if (preset.grunt) { onUpdate({ ...currentVitals, soundType: 'grunt', soundTimestamp: Date.now() }); logAction(`Preset: ${t.presets[preset.key] || preset.key}`); return; }
                const now = Date.now();
                const name = t.presets[preset.key] || preset.key;
                onUpdate({ ...currentVitals, hr: preset.hr, spo2: preset.spo2, rhythm: preset.rhythm || 'sinus', transition: currentVitals.simRunning ? { startTime: now, duration: transitionDuration * 1000, startHr: vitals.hr, targetHr: preset.hr, startSpo2: vitals.spo2, targetSpo2: preset.spo2 } : null });
                logAction(`Preset: ${name}`);
                trackNeoEvent('scenario_preset', `Preset: ${name}`, { preset_type: preset.key });
            };

            const handleRhythmChange = (rhythmKey) => {
                onUpdate({ ...currentVitals, rhythm: rhythmKey });
                logAction(`Ritmo: ${rhythmKey.toUpperCase()}`);
            };

            return (
                <div className="h-screen overflow-y-auto bg-slate-900 text-white flex flex-col">
                    <header className="flex-none flex items-center justify-between px-4 py-3 bg-slate-800 gap-2 flex-wrap">
                        <div className="flex items-center gap-2">
                            <h2 className="font-bold text-blue-400 flex items-center gap-2"><Icons.Smartphone className="w-4 h-4"/> {t.control}</h2>
                            {currentVitals.simRunning && <span className="px-2 py-0.5 bg-red-900/50 text-red-400 text-xs rounded border border-red-500 font-mono animate-pulse">{displayTime}</span>}
                            <button onClick={() => setShowDebrief(true)} className="bg-slate-700 text-xs px-2 py-1 rounded flex items-center gap-1"><Icons.List className="w-3 h-3"/> {t.debriefing}</button>
                        </div>
                        <div className="flex items-center gap-2">
                            {onPatientTypeChange && (
                                <div className={`flex rounded-lg overflow-hidden border ${currentVitals.simRunning ? 'border-slate-700/40 opacity-50' : 'border-slate-600'}`}
                                    title={currentVitals.simRunning ? 'Detener la simulación para cambiar tipo de paciente' : ''}>
                                    {['neonatal', 'pediatrico', 'adulto'].map(type => (
                                        <button key={type}
                                            onClick={() => { if (!currentVitals.simRunning) onPatientTypeChange(type); }}
                                            disabled={currentVitals.simRunning}
                                            className={`px-3 py-1 text-xs font-bold transition-colors ${currentVitals.simRunning ? 'cursor-not-allowed' : 'cursor-pointer'} ${patientType === type ? (type === 'neonatal' ? 'bg-green-700 text-white' : type === 'pediatrico' ? 'bg-yellow-700 text-white' : 'bg-blue-700 text-white') : 'bg-slate-900 text-slate-400 hover:bg-slate-700'}`}>
                                            {type === 'neonatal' ? 'Neo' : type === 'pediatrico' ? 'Ped' : 'Adult'}
                                        </button>
                                    ))}
                                </div>
                            )}
                            {onLangChange && (
                                <div className="flex rounded-lg overflow-hidden border border-slate-600">
                                    {['es','en','pt'].map(l => (
                                        <button key={l} onClick={() => onLangChange(l)}
                                            className={`px-2 py-1 text-xs font-bold uppercase transition-colors ${lang === l ? 'bg-slate-500 text-white' : 'bg-slate-900 text-slate-400 hover:bg-slate-700'}`}>
                                            {l}
                                        </button>
                                    ))}
                                </div>
                            )}
                            <span className="text-xs font-mono border border-slate-600 px-2 py-0.5 rounded text-slate-400">ID: {sessionId}</span>
                        </div>
                    </header>

                    {showCaseEditor && editingCase && <CaseEditorModal caseData={editingCase} onPublish={saveToLibrary} onCancel={() => { setShowCaseEditor(false); setEditingCase(null); }} translating={translating} lang={lang} t={t} />}

                    {showCaseSelector && (
                        <div className="fixed inset-0 bg-black/90 z-50 p-4 flex flex-col" onClick={() => setShowCaseSelector(false)}>
                            <div className="bg-slate-800 rounded-xl flex-1 flex flex-col overflow-hidden max-w-md mx-auto w-full" onClick={e => e.stopPropagation()}>
                                <div className="p-4 border-b border-slate-700 flex justify-between items-center flex-none">

                                    {activeCase.stages.map((stage, i) => (
                                        <div key={i} className={`flex items-center gap-3 p-2 rounded-lg text-sm transition-all ${i === stageIndex ? 'bg-blue-900/50 border border-blue-500/50' : i < stageIndex ? 'opacity-40' : 'opacity-70'}`}>
                                            <div className={`w-6 h-6 rounded-full flex items-center justify-center flex-none text-xs font-bold ${i < stageIndex ? 'bg-green-700 text-green-200' : i === stageIndex ? 'bg-blue-600 text-white' : 'bg-slate-700 text-slate-400'}`}>
                                                {i < stageIndex ? '✓' : i + 1}
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <div className="font-medium text-white truncate">{getStageName(stage)}</div>
                                                <div className="text-xs text-slate-400">FC: {stage.hr || '--'} · SpO2: {stage.spo2}% · {stage.transition}s</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="p-3 border-t border-slate-700">
                                    {stageIndex < activeCase.stages.length - 1 ? (
                                        <button onClick={advanceStage}
                                            className="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold text-white flex items-center justify-center gap-2 active:scale-95 transition-all">
                                            <Icons.ArrowRight className="w-5 h-5"/>
                                            {stageIndex === -1 ? t.startCase : `${t.nextStage}: ${getStageName(activeCase.stages[stageIndex + 1])}`}
                                        </button>
                                    ) : (
                                        <div className="w-full py-3 bg-green-900/40 border border-green-500/30 rounded-lg font-bold text-green-400 text-center text-sm">
                                            {t.caseCompleted}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>
                    <div className="flex-none bg-slate-900 p-2 flex flex-col items-center">
                        <div className="w-full opacity-30 font-mono text-[10px] tracking-widest border border-slate-700 rounded py-1 bg-black/20 text-center mb-1">SPONSOR AREA</div>
                        <SponsorSpace compact className="h-10 w-full" source="Control" t={t} />
                    </div>
                </div>
            );
        };

        const QRScannerView = ({ onScan, onCancel, t }) => {
            const [sid, setSid] = useState('');
            useEffect(() => {
                const html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (decodedText) => {
                    try {
                        const url = new URL(decodedText);
                        const session = url.searchParams.get('session');
                        if (session) { html5QrCode.stop().then(() => onScan(session)); }
                    } catch(e) { html5QrCode.stop().then(() => onScan(decodedText)); }
                }).catch(() => {});
                return () => { if (html5QrCode.isScanning) { html5QrCode.stop().catch(() => {}); } };
            }, []);
            return (
                <div className="fixed inset-0 bg-slate-900 z-[60] flex flex-col p-6 animate-zoom">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="font-bold text-xl flex items-center gap-2"><Icons.Camera className="text-blue-400"/> {t.scanCamera}</h2>
                        <button onClick={onCancel} className="bg-slate-800 p-2 rounded-full"><Icons.X/></button>
                    </div>
                    <div className="bg-black rounded-2xl overflow-hidden shadow-2xl mb-8 relative"><div id="reader"></div></div>
                    <div className="mt-auto text-center space-y-4">
                        <p className="text-slate-500 text-sm mb-4">{t.scanManual}</p>
                        <div className="flex gap-2">
                            <input type="number" placeholder={t.placeholderId} value={sid} onChange={e => setSid(e.target.value)} className="flex-1 bg-slate-800 border border-slate-700 p-4 rounded-xl text-center font-mono text-xl outline-none focus:border-blue-500"/>
                            <button onClick={() => sid && onScan(sid)} className="bg-blue-600 p-4 rounded-xl px-6 font-bold"><Icons.ArrowRight/></button>
                        </div>
                    </div>
                </div>
            );
        };

        const AnimatedGuide = ({ onClose, t }) => (
            <div className="fixed inset-0 bg-slate-950/95 z-[70] flex flex-col p-6 animate-zoom overflow-y-auto">
                <div className="flex justify-between items-center mb-8"><h2 className="text-2xl font-black text-white">{t.guideTitle}</h2><button onClick={onClose} className="p-2 bg-slate-800 rounded-full"><Icons.X /></button></div>
                <div className="flex-1 flex flex-col items-center justify-center space-y-12 max-w-lg mx-auto w-full">
                    <div className="relative w-full flex flex-col items-center">
                        <div className="w-48 h-32 bg-slate-800 border-4 border-slate-700 rounded-lg flex items-center justify-center relative float-anim shadow-2xl"><Icons.Monitor className="w-10 h-10 text-green-500/50" /><div className="absolute inset-4 bg-white/10 rounded flex items-center justify-center"><Icons.QrCode className="w-8 h-8 text-white opacity-80" /></div><div className="absolute -top-4 -right-4 bg-green-600 text-[10px] font-bold px-2 py-1 rounded-full text-white shadow-lg">DEVICE A</div></div>
                        <p className="mt-4 text-center text-sm"><span className="text-green-400 font-bold uppercase block text-xs mb-1">{t.step1}</span>{t.guideStep1}</p>
                    </div>
                    <div className="flex flex-col items-center text-slate-700"><Icons.ArrowRight className="w-8 h-8 rotate-90" /></div>
                    <div className="relative w-full flex flex-col items-center pb-8">
                        <div className="w-20 h-40 bg-slate-800 border-4 border-slate-700 rounded-2xl flex items-center justify-center relative float-anim shadow-2xl" style={{animationDelay: '1.5s'}}><div className="absolute inset-2 bg-black rounded-lg overflow-hidden flex flex-col items-center justify-center"><div className="w-full h-1/2 bg-blue-500/10 flex items-center justify-center relative overflow-hidden"><div className="scan-line"></div><Icons.Camera className="w-6 h-6 text-blue-400 opacity-50" /></div><div className="p-1 space-y-1 w-full"><div className="w-full h-1 bg-slate-700 rounded"></div><div className="w-3/4 h-1 bg-slate-700 rounded"></div></div></div><div className="absolute -top-4 -right-4 bg-blue-600 text-[10px] font-bold px-2 py-1 rounded-full text-white shadow-lg">DEVICE B</div></div>
                        <p className="mt-4 text-center text-sm"><span className="text-blue-400 font-bold uppercase block text-xs mb-1">{t.step2}</span>{t.guideStep2}</p>
                    </div>
                </div>
                <button onClick={onClose} className="mt-8 bg-white text-black font-black py-4 rounded-2xl uppercase tracking-widest text-sm shadow-xl hover:bg-slate-200 transition-colors">{t.guideBtn}</button>
            </div>
        );

        const PatientTypeSelector = ({ current, onSelect, t, disabled = false }) => {
            const types = ['neonatal', 'pediatrico', 'adulto'];
            const labels = { neonatal: 'Neo', pediatrico: 'Ped', adulto: 'Adult' };
            return (
                <div className={`absolute top-6 left-6 z-[80] flex rounded-xl overflow-hidden border shadow-lg ${disabled ? 'border-slate-700/40 opacity-50' : 'border-slate-700'}`}>
                    {types.map(type => (
                        <button key={type}
                            onClick={() => { if (!disabled) onSelect(type); }}
                            disabled={disabled}
                            title={disabled ? 'Detener la simulación para cambiar tipo de paciente' : ''}
                            className={`px-3 py-2 text-xs font-bold transition-colors ${disabled ? 'cursor-not-allowed' : 'cursor-pointer'} ${current === type ? 'bg-blue-700 text-white' : 'bg-slate-900 text-slate-400 hover:bg-slate-800'}`}>
                            {labels[type]}
                        </button>
                    ))}
                </div>
            );
        };

        const LanguageSelector = ({ currentLang, onSelect }) => {
            const [isOpen, setIsOpen] = useState(false);
            const menuRef = useRef(null);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (menuRef.current && !menuRef.current.contains(event.target)) setIsOpen(false);
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            const langs = [
                { id: 'es', label: 'Español' },
                { id: 'en', label: 'English' },
                { id: 'pt', label: 'Português' }
            ];

            return (
                <div className="absolute top-6 right-6 z-[80]" ref={menuRef}>
                    <button 
                        onClick={() => setIsOpen(!isOpen)}
                        className="bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl flex items-center gap-2 hover:bg-slate-800 transition-all shadow-lg min-w-[80px] justify-between"
                    >
                        <span className="text-xs font-bold text-white uppercase">{currentLang}</span>
                        <Icons.ChevronDown className={`w-3 h-3 text-slate-500 transition-transform duration-300 ${isOpen ? 'rotate-180' : ''}`} />
                    </button>
                    
                    {isOpen && (
                        <div className="absolute top-full right-0 mt-2 bg-slate-900 border border-slate-700 rounded-xl overflow-hidden shadow-2xl animate-zoom origin-top-right min-w-[120px]">
                            {langs.map(l => (
                                <button
                                    key={l.id}
                                    onClick={() => { onSelect(l.id); setIsOpen(false); }}
                                    className={`w-full text-left px-4 py-3 text-xs font-medium border-b border-slate-800 last:border-0 hover:bg-slate-800 transition-colors ${currentLang === l.id ? 'bg-slate-800 text-blue-400' : 'text-slate-400'}`}
                                >
                                    {l.label}
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [mode, setMode] = useState('select');
            const [user, setUser] = useState(null);
            const [sessionId, setSessionId] = useState('');
            const [vitals, setVitals] = useState({ ...DEFAULT_VITALS, ...PATIENT_DEFAULTS.neonatal });
            // Estados pre-sesión: solo usados en pantalla select, antes de crear/unirse a sesión
            const browserLang = navigator.language.startsWith('es') ? 'es' : (navigator.language.startsWith('pt') ? 'pt' : 'en');
            const [preSessionLang, setPreSessionLang] = useState(browserLang);
            const [preSessionPatientType, setPreSessionPatientType] = useState('neonatal');
            const [showScanner, setShowScanner] = useState(false);
            const [showGuide, setShowGuide] = useState(false);
            const [vitalsLoaded, setVitalsLoaded] = useState(false);
            const [sid] = useState(Math.floor(1000 + Math.random() * 9000).toString());
            const [clinicalCases, setClinicalCases] = useState(() => {
                return Array.isArray(CLINICAL_CASES) ? CLINICAL_CASES : [];
            });

            // FUENTE ÚNICA DE VERDAD: cuando hay sesión, lang y patientType vienen de Firestore.
            // Sin stale-closures, sin estado duplicado, sin race conditions.
            const lang = sessionId ? (vitals.lang || preSessionLang) : preSessionLang;
            const patientType = sessionId ? (vitals.patientType || 'neonatal') : preSessionPatientType;
            const t = TRANSLATIONS[lang];

            useEffect(() => {
                auth.signInAnonymously().then(cred => setUser(cred.user)).catch(() => setUser({ uid: 'guest' }));
                const p = new URLSearchParams(window.location.search);
                if (p.get('mode') && p.get('session')) { setMode(p.get('mode')); setSessionId(p.get('session')); }
            }, []);

            // Load clinical cases from Firebase if available (one-time load on mount)
            useEffect(() => {
                if (!db) return;
                try {
                    db.collection("admin").doc("clinical_cases").get().then(doc => {
                        if (doc.exists && doc.data() && Array.isArray(doc.data().cases)) {
                            setClinicalCases(doc.data().cases);
                        }
                    }).catch(err => {
                        console.warn('Could not load clinical cases from Firebase:', err?.message);
                    });
                } catch (err) {
                    console.warn('Firebase not ready for clinical cases:', err?.message);
                }
            }, []);

            // Listener limpio: solo setVitals. lang y patientType se derivan automáticamente.
            // vitalsLoaded garantiza que control no se renderiza hasta tener datos de Firestore.
            useEffect(() => {
                if (!sessionId || !db) return;
                const unsub = db.collection("sessions").doc(sessionId).onSnapshot(doc => {
                    if (doc.exists) { setVitals(v => ({ ...v, ...doc.data(), rhythm: doc.data().rhythm || v.rhythm || 'sinus' })); setVitalsLoaded(true); }
                });
                return () => unsub();
            }, [sessionId]);

            useEffect(() => {
                const defaults = PATIENT_DEFAULTS[patientType] || PATIENT_DEFAULTS.neonatal;
                setVitals(prev => ({ ...prev, hr: defaults.hr, spo2: defaults.spo2, simRunning: false, transition: null, rhythm: patientType === 'neonatal' ? 'sinus' : prev.rhythm }));
            }, [patientType]);

            // Handlers: actualización optimista + escritura a Firestore.
            // La otra pantalla recibe el cambio vía su listener onSnapshot → setVitals → re-render.
            const handlePatientTypeChange = (type) => {
                if (vitals.simRunning) return;
                setVitals(prev => ({ ...prev, patientType: type, rhythm: type === 'neonatal' ? 'sinus' : prev.rhythm }));
                if (db && sessionId) db.collection("sessions").doc(sessionId).set({ patientType: type, ...(type === 'neonatal' && { rhythm: 'sinus' }) }, { merge: true });
            };

            const handleLangChange = (newLang) => {
                setVitals(prev => ({ ...prev, lang: newLang }));
                if (db && sessionId) db.collection("sessions").doc(sessionId).set({ lang: newLang }, { merge: true });
            };

            const handleUpdate = (v) => {
                if (db && sessionId) db.collection("sessions").doc(sessionId).set(v, { merge: true });
            };

            if (!user) return <div className="h-screen bg-black flex flex-col items-center justify-center text-green-500"><div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-green-500 mb-4"></div><span className="font-mono text-sm tracking-widest uppercase">{t.connecting}</span></div>;

            if (mode === 'select') {
                return (
                    <div className="h-screen bg-slate-950 flex flex-col items-center justify-center p-6 text-center overflow-y-auto">
                        {showGuide && <AnimatedGuide onClose={() => setShowGuide(false)} t={t} />}
                        {showScanner && <QRScannerView onScan={(s) => { setMode('control'); setSessionId(s); }} onCancel={() => setShowScanner(false)} t={t} />}

                        <PatientTypeSelector current={preSessionPatientType} onSelect={setPreSessionPatientType} t={t} />
                        <LanguageSelector currentLang={preSessionLang} onSelect={setPreSessionLang} />

                        <header className="mb-10">
                            <Icons.Activity className="w-16 h-16 text-green-500 mx-auto mb-4 animate-pulse"/>
                            <h1 className="text-4xl font-black mb-2 tracking-tight text-white">NeoMonitor</h1>
                            <p className="text-slate-400 text-lg font-medium">{t.mainPrompt}</p>
                            <button onClick={() => setShowGuide(true)} className="mt-4 text-blue-400 flex items-center gap-2 mx-auto text-sm font-bold border border-blue-400/30 px-4 py-2 rounded-full hover:bg-blue-400/10 transition-colors"><Icons.Help className="w-4 h-4"/>{t.howToConnect}</button>
                        </header>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl">
                            <button onClick={() => {
                                const initDoc = { ...DEFAULT_VITALS, patientType: preSessionPatientType, lang: preSessionLang };
                                setVitals(initDoc);
                                setVitalsLoaded(true);
                                setSessionId(sid);
                                setMode('monitor');
                                if (db) db.collection("sessions").doc(sid).set(initDoc);
                            }} className="bg-slate-900 border border-slate-800 hover:border-green-500/50 p-8 rounded-3xl flex flex-col items-center gap-6 group transition-all active:scale-95 shadow-2xl"><div className="bg-green-500/10 p-5 rounded-2xl group-hover:bg-green-500/20 transition-colors"><Icons.Monitor className="w-12 h-12 text-green-400"/></div><span className="text-xl font-bold text-white leading-tight">{t.useAsMonitor}</span></button>
                            <button onClick={() => setShowScanner(true)} className="bg-slate-900 border border-slate-800 hover:border-blue-500/50 p-8 rounded-3xl flex flex-col items-center gap-6 group transition-all active:scale-95 shadow-2xl"><div className="bg-blue-500/10 p-5 rounded-2xl group-hover:bg-blue-500/20 transition-colors"><Icons.Smartphone className="w-12 h-12 text-blue-400"/></div><span className="text-xl font-bold text-white leading-tight">{t.useAsControl}</span></button>
                        </div>

                        <div className="mt-12 w-full max-w-md"><SponsorSpace className="h-20 rounded-2xl bg-slate-900/50" source="Menu_Initial" t={t} /><p className="text-[10px] text-slate-600 mt-6 uppercase tracking-widest font-bold">NeoMonitor Simulator</p></div>
                    </div>
                );
            }

            if (mode === 'control' && !vitalsLoaded) {
                return <div className="h-screen bg-black flex flex-col items-center justify-center text-green-500"><div className="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-green-500 mb-4"></div><span className="font-mono text-sm tracking-widest uppercase">{t.connecting}</span></div>;
            }

            return (
                <div className="font-sans antialiased">
                    {mode === 'monitor' && <MonitorScreen sessionId={sessionId} vitals={vitals} t={t} patientType={patientType} onPatientTypeChange={handlePatientTypeChange} />}
                    {mode === 'control' && <ControllerScreen sessionId={sessionId} vitals={vitals} onUpdate={handleUpdate} t={t} lang={lang} db={db} userId={user.uid} userEmail={user.email} patientType={patientType} onPatientTypeChange={handlePatientTypeChange} onLangChange={handleLangChange} clinicalCases={clinicalCases} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
