<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoSim Monitor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM -->
    <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FIREBASE COMPAT -->
    <script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script crossorigin="anonymous" src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        body { background-color: #0f172a; color: white; margin: 0; overflow: hidden; }
        @keyframes pulse-fast { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse-fast { animation: pulse-fast 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        #debug-log {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(220, 38, 38, 0.95); color: white; padding: 1rem;
            font-family: monospace; z-index: 9999; max-height: 50vh; overflow: auto;
            border-top: 2px solid white;
        }
        
        .soft-key {
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            border: 1px solid #475569; color: #cbd5e1; font-family: monospace;
            font-size: 0.8rem; display: flex; align-items: center; justify-content: center;
            text-align: center; border-radius: 4px; cursor: pointer; user-select: none;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .soft-key:active { background: #0f172a; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
        
        /* Sliders */
        input[type=range] { accent-color: #10b981; }
        input[type=range].cyan-slider { accent-color: #06b6d4; }
        input[type=range].time-slider { accent-color: #f59e0b; }
        input[type=range].yellow-slider { accent-color: #facc15; }
    </style>
</head>
<body>
    <div id="root">
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #10b981; font-family: sans-serif;">
            <svg style="animation: spin 1s linear infinite; width: 40px; height: 40px; margin-bottom: 20px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle style="opacity: 0.25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path style="opacity: 0.75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <h2 style="font-size: 1.5rem; font-weight: bold;">Iniciando Monitor...</h2>
            <style>@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</style>
        </div>
    </div>
    <div id="debug-log"></div>

    <script>
        function showError(title, details) {
            const log = document.getElementById('debug-log');
            log.style.display = 'block';
            log.innerHTML += `<div style="margin-bottom:10px;"><strong>${title}</strong><br/><small>${details}</small></div>`;
        }
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            if (msg.includes('ResizeObserver')) return false;
            let details = `${url}:${lineNo}`;
            if (msg === 'Script error.') details += '<br/>(Error externo bloqueado. Revisa la consola)';
            showError('ERROR DE SCRIPT:', `${msg} <br/> ${details}`);
            return false;
        };
        window.onunhandledrejection = function(event) {
            let message = event.reason ? (event.reason.message || event.reason) : 'Error desconocido';
            if (message.toString().includes('offline') || message.toString().includes('network')) return;
            if(message.toString().includes('auth/unauthorized-domain')) message = "BLOQUEADO POR FIREBASE: Dominio no autorizado.";
            showError('ERROR DE CONEXIÓN:', message);
        };
    </script>

    <script type="text/babel">
        // ==========================================
        // 1. CONFIGURACIÓN FIREBASE
        // ==========================================
       const firebaseConfig = {
          apiKey: "AIzaSyA46SqiHL-U13mdaJnee-KhD372aWc5h2E",
          authDomain: "monitor-36c41.firebaseapp.com",
          projectId: "monitor-36c41",
          storageBucket: "monitor-36c41.firebasestorage.app",
          messagingSenderId: "830562769122",
          appId: "1:830562769122:web:1db7060de0c80556db66bb"
        };

        let db, auth;
        const isConfigured = firebaseConfig.apiKey !== "TU_API_KEY_AQUI";

        if (isConfigured && typeof firebase !== 'undefined') {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                auth = firebase.auth();
                db.enablePersistence().catch(err => console.log("Persistencia no disponible:", err.code));
            } catch (error) { console.error("Error iniciando Firebase:", error); }
        }

        const { useState, useEffect, useRef, useMemo } = React;

        // --- AUDIO ---
        let audioCtx;
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) audioCtx = new AudioContext();
        } catch (e) { console.warn("AudioContext no soportado:", e); }
        
        const playBeep = (pitch = 800) => {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            try {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.value = pitch;
                const now = audioCtx.currentTime;
                gainNode.gain.setValueAtTime(0.2, now); 
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                oscillator.start(now);
                oscillator.stop(now + 0.15);
            } catch (e) { console.error("Error audio:", e); }
        };

        const playAlarmSequence = (type) => {
             if (!audioCtx || audioCtx.state === 'suspended') return;
             const now = audioCtx.currentTime;
             const createTone = (freq, start, duration) => {
                 const osc = audioCtx.createOscillator();
                 const gain = audioCtx.createGain();
                 osc.connect(gain);
                 gain.connect(audioCtx.destination);
                 osc.type = 'square'; 
                 osc.frequency.value = freq;
                 gain.gain.setValueAtTime(0.1, start);
                 gain.gain.setValueAtTime(0, start + duration);
                 osc.start(start);
                 osc.stop(start + duration);
             };
             if (type === 'critical') {
                 createTone(880, now, 0.1);
                 createTone(880, now + 0.2, 0.1);
                 createTone(880, now + 0.4, 0.1);
             } else if (type === 'warning') {
                 createTone(600, now, 0.2);
                 createTone(600, now + 0.4, 0.2);
             }
        };

        // --- ICONOS ---
        const Icons = {
            Activity: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>,
            Heart: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>,
            Wind: ({className, style}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>,
            Monitor: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>,
            Smartphone: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/></svg>,
            AlertTriangle: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,
            Wifi: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>,
            WifiOff: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>,
            Volume2: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>,
            VolumeX: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" x2="17" y1="9" y2="15"/><line x1="17" x2="23" y1="9" y2="15"/></svg>,
            Play: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>,
            Battery: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="10" x="2" y="7" rx="2" ry="2"/><line x1="22" x2="22" y1="11" y2="13"/></svg>,
            Menu: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>,
            QrCode: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>,
            X: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
            Clock: ({className}) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        };

        const DEFAULT_VITALS = { hr: 140, spo2: 98, resp: 45, alarmMuted: false, connected: true, transition: null };

        // --- HOOK INTERPOLACIÓN ---
        const useInterpolatedVitals = (targetVitals) => {
            const [currentVitals, setCurrentVitals] = useState(targetVitals);
            const requestRef = useRef();
            
            useEffect(() => {
                const animate = () => {
                    const now = Date.now();
                    const t = targetVitals.transition;

                    if (t && t.duration > 0) {
                        const elapsed = now - t.startTime;
                        let progress = elapsed / t.duration;
                        if (elapsed < -2000) progress = 0; 
                        const safeProgress = Math.max(0, Math.min(1, progress));
                        const ease = safeProgress;

                        if (safeProgress < 1) {
                            setCurrentVitals({
                                ...targetVitals,
                                hr: Math.round(t.startHr + (t.targetHr - t.startHr) * ease),
                                spo2: Math.round(t.startSpo2 + (t.targetSpo2 - t.startSpo2) * ease),
                                resp: Math.round(t.startResp + (t.targetResp - t.startResp) * ease),
                            });
                            requestRef.current = requestAnimationFrame(animate);
                        } else {
                            setCurrentVitals(targetVitals);
                        }
                    } else {
                        setCurrentVitals(targetVitals);
                    }
                };
                requestRef.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(requestRef.current);
            }, [targetVitals]);

            return currentVitals;
        };

        // --- COMPONENTES ---

        const WaveformCanvas = ({ color, speed, type, flatline, onBeat }) => {
            const canvasRef = useRef(null);
            const dataRef = useRef([]);
            const phaseRef = useRef(0);
            const frameRef = useRef(0);
            const lastTimeRef = useRef(performance.now());

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                if (dataRef.current.length === 0) dataRef.current = new Array(canvas.width).fill(canvas.height / 2);

                const draw = (time) => {
                    const deltaTime = (time - lastTimeRef.current) / 1000;
                    lastTimeRef.current = time;
                    if (deltaTime > 0.1) { frameRef.current = requestAnimationFrame(draw); return; }

                    if (canvas.width !== canvas.offsetWidth) {
                        canvas.width = canvas.offsetWidth;
                        canvas.height = canvas.offsetHeight;
                        dataRef.current = new Array(canvas.width).fill(canvas.height / 2);
                    }

                    let newValue = canvas.height / 2;
                    const amplitude = canvas.height / 3;
                    
                    if (!flatline) {
                        const beatsPerSecond = speed / 60;
                        const angularSpeed = beatsPerSecond * 2 * Math.PI;
                        const prevPhase = phaseRef.current;
                        phaseRef.current += angularSpeed * deltaTime;
                        if (phaseRef.current >= 2 * Math.PI) phaseRef.current -= 2 * Math.PI;
                        const p = phaseRef.current;

                        if (type === 'ecg' && onBeat) {
                             const threshold = Math.PI;
                             if ((prevPhase < threshold && p >= threshold) || (prevPhase > p && prevPhase < threshold)) onBeat();
                        }

                        if (type === 'ecg') {
                            if (p > 3.0 && p < 3.28) newValue = (canvas.height / 2) - (amplitude * 2.5 * Math.exp(-Math.pow(p - Math.PI, 2) * 50));
                            else if (p > 3.5 && p < 4.5) newValue = (canvas.height / 2) - (amplitude * 0.3 * Math.sin(p - 3.5));
                            else if (p > 2.5 && p < 2.9) newValue = (canvas.height / 2) - (amplitude * 0.15 * Math.sin((p - 2.5) * 5));
                            else newValue = (canvas.height / 2) + (Math.random() * 1.5 - 0.75);
                        } else {
                            const wave = Math.sin(p) + 0.5 * Math.sin(2 * p + 0.5);
                            newValue = (canvas.height / 2) - (wave * amplitude * 0.6);
                        }
                    } else {
                        newValue = (canvas.height / 2) + (Math.random() * 2 - 1);
                    }

                    if (newValue < 5) newValue = 5;
                    if (newValue > canvas.height - 5) newValue = canvas.height - 5;

                    dataRef.current.push(newValue);
                    dataRef.current.shift();

                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = color;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.beginPath();
                    for (let i = 0; i < dataRef.current.length; i++) {
                        if (i === 0) ctx.moveTo(i, dataRef.current[i]);
                        else ctx.lineTo(i, dataRef.current[i]);
                    }
                    ctx.stroke();
                    frameRef.current = requestAnimationFrame(draw);
                };
                frameRef.current = requestAnimationFrame(draw);
                return () => cancelAnimationFrame(frameRef.current);
            }, [color, speed, type, flatline, onBeat]);

            return <canvas ref={canvasRef} className="w-full h-full block"></canvas>;
        };

        const RoleSelection = ({ onSelect }) => {
            const [sessionId, setSessionId] = useState('');
            return (
                <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-4">
                    <div className="max-w-md w-full bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700">
                        <div className="flex justify-center mb-6"><Icons.Activity /></div>
                        <h1 className="text-3xl font-bold text-center mb-2 text-emerald-400">NeoSim</h1>
                        <p className="text-slate-400 text-center mb-8 italic text-sm">aplicación hecha con muchas ganas pero poco conocimiento.<br/>Uselo bajo su exclusiva responsabilidad.</p>
                        <div className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-slate-300 mb-2">Código de Sesión</label>
                                <div className="flex gap-2">
                                    <input type="number" value={sessionId} onChange={(e) => setSessionId(e.target.value)} placeholder="Ej: 1234" className="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white text-center text-xl outline-none" />
                                    <button onClick={() => setSessionId(Math.floor(1000 + Math.random() * 9000).toString())} className="px-4 py-2 bg-slate-700 rounded-lg text-sm hover:bg-slate-600">Generar</button>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <button onClick={() => sessionId && onSelect('monitor', sessionId)} disabled={!sessionId} className="flex flex-col items-center p-6 bg-slate-700 hover:bg-slate-600 rounded-xl transition-all disabled:opacity-50">
                                    <Icons.Monitor className="w-8 h-8 mb-3 text-emerald-400" />
                                    <span className="font-semibold">Monitor</span>
                                </button>
                                <button onClick={() => sessionId && onSelect('control', sessionId)} disabled={!sessionId} className="flex flex-col items-center p-6 bg-slate-700 hover:bg-slate-600 rounded-xl transition-all disabled:opacity-50">
                                    <Icons.Smartphone className="w-8 h-8 mb-3 text-blue-400" />
                                    <span className="font-semibold">Control</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const MonitorScreen = ({ sessionId, vitals: targetVitals, connectionStatus }) => {
            const vitals = useInterpolatedVitals(targetVitals);
            
            const [alarmState, setAlarmState] = useState('none');
            const [flash, setFlash] = useState(false);
            const [audioEnabled, setAudioEnabled] = useState(false);
            const [time, setTime] = useState(new Date());
            const [showQR, setShowQR] = useState(false);
            const [qrUrl, setQrUrl] = useState('');

            const isPreviewEnv = window.location.hostname.includes('usercontent.goog') || window.location.protocol === 'file:';

            const enableAudio = () => { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); setAudioEnabled(true); };
            const handleBeat = () => { if (!audioEnabled || vitals.alarmMuted) return; let pitch = 800; if (vitals.spo2 < 85) pitch = 400; playBeep(pitch); };

            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            useEffect(() => {
                let level = 'none';
                if (vitals.hr < 60 || vitals.hr === 0 || vitals.spo2 < 80) level = 'critical';
                else if (vitals.hr < 100 || vitals.hr > 180 || vitals.spo2 < 90) level = 'warning';
                setAlarmState(level);
                const interval = setInterval(() => setFlash(p => !p), level === 'critical' ? 300 : 800);
                return () => clearInterval(interval);
            }, [vitals.hr, vitals.spo2]);

            useEffect(() => {
                let interval;
                if (audioEnabled && !vitals.alarmMuted && alarmState !== 'none') {
                    playAlarmSequence(alarmState);
                    interval = setInterval(() => playAlarmSequence(alarmState), alarmState === 'critical' ? 2500 : 4000);
                }
                return () => clearInterval(interval);
            }, [alarmState, audioEnabled, vitals.alarmMuted]);

            useEffect(() => {
                if (showQR) {
                    let baseUrl = window.location.origin + window.location.pathname;
                    if (!baseUrl.endsWith('/') && !baseUrl.endsWith('.html')) {
                        baseUrl += '/';
                    }
                    const fullUrl = `${baseUrl}?mode=control&session=${sessionId}`;
                    setQrUrl(fullUrl);
                }
            }, [showQR, sessionId]);

            const getBorderColor = () => {
                if (alarmState === 'none' || vitals.alarmMuted) return 'border-transparent';
                if (alarmState === 'critical') return flash ? 'border-red-600 bg-red-900/20' : 'border-red-900';
                return flash ? 'border-yellow-500 bg-yellow-900/20' : 'border-yellow-900';
            };

            const getTextColor = (base) => (alarmState !== 'none' && !vitals.alarmMuted && flash) ? 'text-white' : base;

            return (
                <div className={`w-full h-screen bg-black flex flex-col border-[12px] ${getBorderColor()} transition-colors duration-100 overflow-hidden relative`}>
                    
                    {!connectionStatus && (
                        <div className="absolute top-0 left-0 w-full bg-red-600 text-white text-center text-xs py-1 z-50">
                            Reconectando...
                        </div>
                    )}

                    {!audioEnabled && !showQR && (
                        <div className="absolute inset-0 bg-black/80 z-50 flex items-center justify-center">
                            <button onClick={enableAudio} className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-6 px-12 rounded-2xl text-2xl flex items-center gap-4 animate-bounce">
                                <Icons.Play className="w-8 h-8 fill-current" />
                                Click para Iniciar Monitor y Sonido
                            </button>
                        </div>
                    )}

                    {showQR && (
                        <div className="absolute inset-0 bg-black/90 z-50 flex flex-col items-center justify-center p-8 text-center">
                            <div className="bg-white p-8 rounded-xl flex flex-col items-center max-w-md w-full">
                                <h3 className="text-black text-2xl font-bold mb-4">Conexión Remota</h3>
                                {isPreviewEnv ? (
                                    <div className="bg-red-100 border-2 border-red-500 text-red-700 p-4 rounded-lg mb-4">
                                        <p className="font-bold">¡Estás en modo PREVIEW!</p>
                                        <p className="text-sm font-bold mt-2 underline">Sube este código a GitHub Pages.</p>
                                    </div>
                                ) : (
                                    <>
                                        <img src={`https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(qrUrl)}`} alt="Scan QR" className="border-4 border-white mb-2" />
                                        <p className="text-black text-sm">Escanea con tu celular para<br/>usarlo como control.</p>
                                    </>
                                )}
                                <button onClick={() => setShowQR(false)} className="mt-6 bg-slate-800 text-white px-6 py-2 rounded-lg flex items-center gap-2 hover:bg-slate-700"><Icons.X className="w-5 h-5"/> Cerrar</button>
                            </div>
                        </div>
                    )}

                    <div className="flex justify-between px-4 py-2 bg-slate-900/50 text-slate-400 text-sm font-mono border-b border-slate-800" style={{minHeight: '35px'}}>
                        <div className="flex gap-4"><span>NEONATAL</span><span>CAMA: 01</span></div>
                        <div className="flex gap-2 items-center">
                             {vitals.alarmMuted ? <Icons.VolumeX className="text-orange-500 w-4 h-4" /> : <Icons.Volume2 className="text-emerald-500 w-4 h-4" />}
                             <span>ID: {sessionId}</span>
                        </div>
                    </div>

                    <div className="flex-1 grid grid-rows-[1fr_1fr_1fr] divide-y divide-slate-800" style={{height: 'calc(100vh - 90px)'}}>
                        <div className="grid grid-cols-[70%_30%] h-full min-h-0">
                            <div className="relative h-full border-r border-slate-800 bg-black">
                                <span className="absolute top-2 left-2 text-yellow-400 font-bold text-sm z-10">II</span>
                                <WaveformCanvas color="#facc15" speed={vitals.hr} type="ecg" flatline={vitals.hr === 0} onBeat={handleBeat} />
                            </div>
                            <div className="flex flex-col justify-center items-end pr-4 relative min-w-0">
                                <span className="absolute top-2 right-2 text-yellow-400 font-bold text-lg">FC</span>
                                <div className="absolute top-10 right-2 text-yellow-600 font-mono text-xl flex flex-col items-end leading-tight opacity-80">
                                    <span style={{fontSize: '2.5vh'}}>180</span>
                                    <span style={{fontSize: '2.5vh'}}>100</span>
                                </div>
                                <span className={`leading-none font-mono font-bold ${getTextColor('text-yellow-400')}`} style={{fontSize: '12vh'}}>{vitals.hr}</span>
                            </div>
                        </div>
                        <div className="grid grid-cols-[70%_30%] h-full min-h-0">
                            <div className="relative h-full border-r border-slate-800 bg-black">
                                <span className="absolute top-2 left-2 text-cyan-500 font-bold text-sm z-10">Pleth</span>
                                <WaveformCanvas color="#06b6d4" speed={vitals.hr} type="pleth" flatline={vitals.spo2 === 0} />
                            </div>
                            <div className="flex flex-col justify-center items-end pr-4 relative min-w-0">
                                <span className="absolute top-2 right-2 text-cyan-500 font-bold text-lg">SpO2</span>
                                <div className="absolute top-10 right-2 text-cyan-600 font-mono text-xl flex flex-col items-end leading-tight opacity-80">
                                    <span style={{fontSize: '2.5vh'}}>100</span>
                                    <span style={{fontSize: '2.5vh'}}>90</span>
                                </div>
                                <div className="flex items-baseline">
                                    <span className={`leading-none font-mono font-bold ${getTextColor('text-cyan-500')}`} style={{fontSize: '12vh'}}>{vitals.spo2}</span>
                                    <span className={`ml-2 ${getTextColor('text-cyan-500')}`} style={{fontSize: '5vh'}}>%</span>
                                </div>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 h-full divide-x divide-slate-800 min-h-0">
                             <div className="flex flex-col justify-center items-end pr-4 relative min-w-0">
                                <span className="absolute top-2 left-4 text-slate-500 font-bold text-lg">RESP</span>
                                <div className="flex items-center gap-4">
                                    <span className="leading-none font-mono font-bold text-slate-600" style={{fontSize: '10vh'}}>---</span>
                                </div>
                             </div>
                             <div className="flex flex-col justify-center pl-8 relative min-w-0">
                                <span className="absolute top-2 left-4 text-slate-500 font-bold text-lg">PNI</span>
                                <span className="font-mono font-bold text-slate-600 leading-none" style={{fontSize: '7vh'}}>---/---</span>
                                <span className="text-slate-700 text-xl mt-2">(--)</span>
                             </div>
                        </div>
                    </div>

                    <div className="bg-slate-900 border-t border-slate-700 p-2 flex justify-between items-center h-16 shrink-0">
                        <div className="flex gap-2 h-full">
                            <div className="soft-key w-24">Menú<br/>Principal</div>
                            <div className="soft-key w-24">Silenciar<br/>Alarmas</div>
                            <div className="soft-key w-24">Tendencias</div>
                            <div onClick={() => setShowQR(true)} className="soft-key w-24 bg-blue-900/30 text-blue-200 border-blue-800 hover:bg-blue-800/50">C. Remoto<br/><Icons.QrCode className="inline w-3 h-3 ml-1"/></div>
                        </div>
                        <div className="flex gap-2 h-full">
                            <div className="soft-key w-24 text-slate-500 border-slate-800 cursor-not-allowed">PNI<br/>Inicio/Parada</div>
                            <div className="soft-key w-24 text-slate-500 border-slate-800 cursor-not-allowed">Cero<br/>PNI</div>
                        </div>
                        <div className="flex items-center gap-4 px-4 text-slate-400 font-mono text-sm border-l border-slate-700 ml-4">
                            <div className="flex flex-col items-end">
                                <span>{time.toLocaleTimeString()}</span>
                                <span className="text-xs">{time.toLocaleDateString()}</span>
                            </div>
                            <div className="flex gap-3">
                                {connectionStatus ? <Icons.Wifi className="w-5 h-5 text-green-500" /> : <Icons.WifiOff className="w-5 h-5 text-red-500 animate-pulse" />}
                                <Icons.Battery className="w-5 h-5 text-green-500" />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const ControllerScreen = ({ sessionId, vitals: currentVitals, onUpdate }) => {
            const vitals = useInterpolatedVitals(currentVitals);
            const [transitionDuration, setTransitionDuration] = useState(0);

            const handleVitalsChange = (newValues) => {
                const now = Date.now();
                const durationMs = transitionDuration * 1000;
                const updateData = {
                    ...newValues,
                    transition: (durationMs > 0) ? {
                        startTime: now,
                        duration: durationMs,
                        startHr: vitals.hr,
                        targetHr: newValues.hr !== undefined ? newValues.hr : vitals.hr,
                        startSpo2: vitals.spo2,
                        targetSpo2: newValues.spo2 !== undefined ? newValues.spo2 : vitals.spo2,
                        startResp: vitals.resp,
                        targetResp: newValues.resp !== undefined ? newValues.resp : vitals.resp
                    } : null
                };
                onUpdate(updateData);
            };

            return (
                <div className="min-h-screen bg-slate-900 text-white p-4 pb-20">
                    <header className="flex justify-between items-center mb-6 bg-slate-800 p-4 rounded-lg">
                        <h2 className="font-bold text-blue-400 flex items-center gap-2"><Icons.Wifi className="w-4 h-4"/> Control Remoto</h2>
                        <div className={`w-3 h-3 rounded-full ${vitals.connected ? 'bg-green-500' : 'bg-red-500'}`}></div>
                    </header>
                    <div className="space-y-6 max-w-lg mx-auto">
                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <div className="flex justify-between mb-2">
                                <label className="text-amber-400 font-bold flex gap-2"><Icons.Clock className="w-5 h-5"/> Tiempo Transición</label>
                                <span className="text-white font-mono font-bold text-xl">{transitionDuration}s</span>
                            </div>
                            <input type="range" min="0" max="90" step="10" value={transitionDuration} onChange={(e) => setTransitionDuration(parseInt(e.target.value))} className="w-full h-8 time-slider cursor-pointer" />
                            <div className="flex justify-between text-xs text-slate-500 mt-1"><span>Inmediato</span><span>90 seg</span></div>
                        </div>
                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700">
                            <div className="flex justify-between mb-2">
                                <label className="text-yellow-400 font-bold flex gap-2"><Icons.Heart className="w-5 h-5"/> FC: {currentVitals.hr}</label>
                                <span className="text-slate-400 text-xs mt-1">Actual: {vitals.hr}</span>
                            </div>
                            <input type="range" min="0" max="200" value={currentVitals.hr} onChange={(e) => handleVitalsChange({hr: parseInt(e.target.value)})} className="w-full h-12 accent-yellow-400 cursor-pointer" />
                        </div>
                        <div className="bg-slate-800 p-6 rounded-xl border border-slate-700">
                            <div className="flex justify-between mb-2">
                                <label className="text-cyan-400 font-bold flex gap-2"><Icons.Activity className="w-5 h-5"/> SpO2: {currentVitals.spo2}%</label>
                                <span className="text-slate-400 text-xs mt-1">Actual: {vitals.spo2}%</span>
                            </div>
                            <input type="range" min="0" max="100" value={currentVitals.spo2} onChange={(e) => handleVitalsChange({spo2: parseInt(e.target.value)})} className="w-full h-12 accent-cyan-500 cursor-pointer" />
                        </div>
                        <div className="grid grid-cols-2 gap-3">
                            <button onClick={() => handleVitalsChange({hr: 140, spo2: 98, resp: 45})} className="p-4 bg-emerald-900/40 border border-emerald-500/50 rounded-lg text-emerald-400 font-bold">Normal</button>
                            <button onClick={() => handleVitalsChange({hr: 60, spo2: 85, resp: 20})} className="p-4 bg-yellow-900/40 border border-yellow-500/50 rounded-lg text-yellow-400 font-bold">Bradicardia</button>
                            <button onClick={() => handleVitalsChange({hr: 150, spo2: 65, resp: 60})} className="p-4 bg-blue-900/40 border border-blue-500/50 rounded-lg text-blue-400 font-bold">Desaturación</button>
                            <button onClick={() => handleVitalsChange({hr: 0, spo2: 0, resp: 0})} className="p-4 bg-red-900/40 border border-red-500/50 rounded-lg text-red-500 font-bold flex items-center justify-center gap-2"><Icons.AlertTriangle className="w-4 h-4"/> PARO</button>
                        </div>
                        <button onClick={() => onUpdate({ alarmMuted: !vitals.alarmMuted })} className={`w-full py-4 rounded-lg font-bold flex justify-center gap-2 ${vitals.alarmMuted ? 'bg-orange-600' : 'bg-slate-700'}`}>
                             {vitals.alarmMuted ? 'Alarmas Silenciadas' : 'Silenciar Alarmas'}
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [mode, setMode] = useState('select');
            const [sessionId, setSessionId] = useState('');
            const [vitals, setVitals] = useState(DEFAULT_VITALS);
            const [user, setUser] = useState(null);
            const [isConnected, setIsConnected] = useState(true);

            if (!isConfigured) return <div className="min-h-screen bg-slate-900 text-white flex flex-col items-center justify-center p-8 text-center fade-in"><Icons.AlertTriangle className="w-16 h-16 text-yellow-500 mb-4" /><h1 className="text-3xl font-bold mb-4">Falta Configuración</h1><p className="text-slate-400 max-w-md mb-8">Para usar este monitor, debes abrir el archivo <code>index.html</code> con un editor de texto y pegar tus credenciales de Firebase donde dice <code>TU_API_KEY_AQUI</code>.</p><div className="bg-slate-800 p-4 rounded text-left font-mono text-xs text-emerald-400 w-full max-w-md overflow-auto">const YOUR_FIREBASE_CONFIG = &#123;<br/>&nbsp;&nbsp;apiKey: "PEGAR_AQUI",<br/>&nbsp;&nbsp;...<br/>&#125;</div></div>;

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const urlMode = params.get('mode');
                const urlSession = params.get('session');
                if (urlMode && urlSession) {
                    setMode(urlMode);
                    setSessionId(urlSession);
                }

                if (auth) {
                    auth.signInAnonymously().catch(err => console.error("Error Auth:", err));
                    const unsubscribe = auth.onAuthStateChanged(setUser);
                    return () => unsubscribe();
                } else {
                    console.warn("Firebase no cargó, iniciando modo visual limitado");
                    setUser({uid: 'demo'});
                }
            }, []);

            useEffect(() => {
                if (!sessionId || !user || !db) return;
                
                let unsubscribe;
                const connect = () => {
                    try {
                        unsubscribe = db.collection("sessions").doc(sessionId).onSnapshot(
                            (doc) => { 
                                if (doc.exists) {
                                    setVitals({...doc.data(), connected: true});
                                    setIsConnected(true);
                                }
                            }, 
                            (error) => {
                                console.log("Conexión perdida, reintentando...", error);
                                setIsConnected(false);
                                setTimeout(connect, 2000); 
                            }
                        );
                    } catch(e) { console.error("Error Firestore:", e); setIsConnected(false); }
                };

                connect();
                return () => unsubscribe && unsubscribe();
            }, [sessionId, user]);

            const handleUpdate = async (newVitals) => {
                if (sessionId && db) await db.collection("sessions").doc(sessionId).set(newVitals, { merge: true });
            };

            const onSelect = (m, id) => { setMode(m); setSessionId(id); };

            if (!user) return <div style={{height: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: "white"}}>Cargando... (Verifica el cuadro rojo si aparece)</div>;

            return (
                <div className="font-sans antialiased">
                    {mode === 'select' && <RoleSelection onSelect={onSelect} />}
                    {mode === 'monitor' && <MonitorScreen sessionId={sessionId} vitals={vitals} connectionStatus={isConnected} />}
                    {mode === 'control' && <ControllerScreen sessionId={sessionId} vitals={vitals} onUpdate={handleUpdate} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
